<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<meta name="application-name" content="客户管理高保真原型" />
<title>客户管理 · 万油通运营中台高保真原型</title>
<style>
:root{
  font-family:-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,Arial,sans-serif;
  color:#1f2d3d;background:#f4f7fb;font-synthesis:none;
  --primary:#1f5dbc;--primary-hover:#174ea8;--primary-soft:#eef6ff;--primary-muted:#4c79bd;
  --primary-subtle:#edf3fb;--primary-border:#c8dcf4;
  --control-height:34px;--control-radius:14px;--section-radius:20px;--panel-radius:28px;
  --control-border:#d6deea;--line:#e5ebf3;--muted:#728198;--label:#2c394c;
  --surface:#fff;--workspace:#f4f7fb;--shadow:0 14px 40px rgba(30,58,104,.08);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-width:1280px;min-height:100%}
body{min-height:100vh;overflow:hidden;font-size:13px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}
button{color:inherit}
.hidden{display:none !important}
.icon{width:16px;height:16px;display:inline-block;vertical-align:-3px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ---------- shell ---------- */
.app-shell{min-height:100vh;background:var(--workspace)}
.side-nav{position:fixed;z-index:30;inset:0 auto 0 0;width:212px;background:#fff;border-right:1px solid #edf1f6;overflow:hidden}
.side-logo{height:78px;display:flex;align-items:center;padding:0 22px}
.side-logo .logo-badge{width:30px;height:30px;margin-right:10px;display:grid;place-items:center;border-radius:10px;background:linear-gradient(135deg,#1f5dbc,#3d84e8);color:#fff}
.side-logo .logo-badge .icon{width:17px;height:17px;stroke-width:2}
.side-logo b{color:#1f2d3d;font-size:17px;font-weight:700;white-space:nowrap}
.side-logo b em{display:block;font-style:normal;font-size:10px;font-weight:500;color:#9aa6b8;letter-spacing:.06em;margin-top:2px}
.full-menu{height:calc(100vh - 78px);padding:12px 12px 28px;overflow-y:auto;scrollbar-width:thin}
.menu-group{width:100%}
.full-menu button{width:100%;border:0;background:transparent;cursor:pointer;text-align:left}
.menu-parent{height:38px;margin-top:6px;padding:0 12px;display:flex;align-items:center;gap:9px;color:#6f7f95;border-radius:6px;font-size:12px;font-weight:600}
.menu-group:first-child .menu-parent{margin-top:0}
.menu-parent:hover,.menu-parent.is-open{color:var(--primary);font-weight:700}
.menu-parent .icon{width:18px;height:18px;opacity:.85}
.menu-chevron{width:7px;height:7px;margin-left:auto;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg);transition:transform .18s}
.menu-parent.is-open .menu-chevron{transform:rotate(225deg)}
.menu-children{padding:2px 0 4px}
.menu-children button{height:38px;margin:3px 0;padding:0 10px 0 36px;color:#6f7f95;border-radius:6px;font-size:12px}
.menu-children button:hover{background:#f5f8fc;color:#3d4c60}
.menu-children button.active{height:40px;color:#fff;background:var(--primary);font-weight:700;box-shadow:0 6px 16px rgba(31,93,188,.24)}
.menu-children button .soon{margin-left:6px;font-size:10px;color:#b0bac8;font-weight:500}
.menu-children button.active .soon{color:#cfe0f8}
.main-shell{margin-left:212px;min-height:100vh}
.top-header{height:66px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;background:#ffffffb8;border-bottom:1px solid #eef2f8}
.page-title{display:flex;gap:12px;align-items:center}
.page-title .entry-mark{width:18px;height:18px;color:var(--primary);opacity:.9}
.page-title b{font-size:22px;font-weight:800;color:#1f2d3d}
.page-title small{margin-left:4px;padding:3px 9px;border-radius:9px;background:var(--primary-soft);color:var(--primary);font-size:11px;font-weight:600}
.header-actions{display:flex;align-items:center;gap:14px}
.header-actions .hint{color:#9aa6b8;font-size:11px}
.profile{width:34px;height:34px;border-radius:50%;background:#eaf1fb;color:#3f6fb0;display:grid;place-items:center;font-size:12px;font-weight:700}
.content{height:calc(100vh - 66px);padding:20px 24px;overflow:auto}

/* ---------- filter ---------- */
.filter-card{padding:22px 28px 0;margin-bottom:20px;border-radius:var(--panel-radius);background:#fff;box-shadow:var(--shadow)}
.filter-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 30px;align-items:center;width:100%}
.filter-item{display:grid;grid-template-columns:76px minmax(0,1fr);align-items:center;gap:12px;min-width:0}
.filter-item>span{color:#2c394c;font-size:13px;white-space:nowrap}
.filter-footer{min-height:58px;margin-top:20px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid #edf1f6}
.filter-actions{display:flex;justify-content:flex-end;align-items:center;gap:10px}
.more-filter{height:30px;color:var(--primary);background:transparent;border:0;font-size:12px;cursor:pointer;padding:0}
.filter-extra{margin-top:18px}
.filter-card.compact{padding-bottom:22px}
.filter-inline{display:flex;align-items:flex-end;gap:24px}
.filter-inline .filter-grid{flex:1}
.filter-inline .filter-actions{flex:0 0 auto;padding-bottom:1px}

/* ---------- controls ---------- */
input,select,textarea{width:100%;height:32px;color:#314052;background:#fff;border:1px solid var(--control-border);border-radius:var(--control-radius);outline:none;font-size:12px;transition:border-color .15s,box-shadow .15s,background-color .15s}
input{padding:0 11px}
input::placeholder,textarea::placeholder{color:#9daabd}
input:hover:not(:disabled),select:hover:not(:disabled){border-color:#aebfd6}
input:focus,select:focus,textarea:focus{border-color:#7da7df;box-shadow:0 0 0 2px #1f5dbc17}
input:disabled,select:disabled,textarea:disabled{color:#8995a7;background:#f5f7fa;cursor:not-allowed}
textarea{height:auto;min-height:82px;padding:10px 12px;border-radius:14px;font-size:12px;line-height:20px;resize:vertical}
.select-wrap{position:relative;width:100%}
.select-wrap select{appearance:none;-webkit-appearance:none;padding:0 32px 0 11px;cursor:pointer}
.select-chevron{position:absolute;top:50%;right:11px;width:12px;height:12px;transform:translateY(-50%);pointer-events:none;color:#95a2b5}
.date-range{position:relative;width:100%}
.date-range input{padding-left:32px}
.date-range .icon{position:absolute;left:11px;top:50%;width:13px;height:13px;transform:translateY(-50%);color:#95a2b5;pointer-events:none}
.btn{height:32px;padding:0 17px;display:inline-flex;align-items:center;justify-content:center;gap:7px;color:#516176;background:#fff;border:1px solid var(--control-border);border-radius:var(--control-radius);font-size:12px;white-space:nowrap;cursor:pointer;transition:all .15s ease}
.btn:hover{color:var(--primary);border-color:#8aa5d8}
.btn.primary{color:#fff;background:var(--primary);border-color:var(--primary)}
.btn.primary:hover{background:var(--primary-hover);color:#fff}
.btn.primary-soft{color:var(--primary);background:var(--primary-soft);border-color:#a9c8f5}
.btn.primary-soft:hover{background:#e3efff}
.btn.small{min-width:86px;padding:0 13px}
.btn:disabled{color:#abb4c1 !important;background:#f3f5f8 !important;border-color:#e3e7ed !important;cursor:not-allowed !important}
.btn b{font-size:15px;font-weight:400;margin-right:1px}

/* ---------- panel + table ---------- */
.panel-card{padding:20px 22px;min-height:520px;border-radius:var(--panel-radius);background:#fff;box-shadow:var(--shadow)}
.panel-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:18px}
.panel-toolbar>div{display:flex;gap:10px}
.panel-toolbar>span{color:#8a94a5;font-size:12px}
.panel-toolbar>span b{color:var(--primary);font-weight:600}
.table-scroll{width:100%;overflow-x:auto;scrollbar-width:thin;scrollbar-color:#c8d2df transparent}
.table-scroll::-webkit-scrollbar{height:8px}
.table-scroll::-webkit-scrollbar-thumb{background:#c8d2df;border:2px solid #fff;border-radius:8px}
.customer-table{width:100%;min-width:1296px;border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:12px}
.customer-table th{height:38px;padding:0 12px 0 0;color:#9ca8b8;background:#fff;border-bottom:1px solid #e5ebf3;font-weight:500;text-align:left;white-space:nowrap}
.customer-table td{height:76px;padding:0 12px 0 0;color:#2e3a4d;border-bottom:1px solid transparent;vertical-align:middle;overflow:hidden}
.customer-table tbody tr:last-child td{border-bottom:0}
.customer-table tbody tr:hover td{background:#fbfdff}
.customer-table td small{display:block;margin-top:7px;color:#929eb0;font-size:11px;line-height:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.customer-table td b{color:#3a4658;font-size:12px;font-weight:500}
.check-cell{position:sticky;left:0;z-index:3;width:42px !important;padding:0 10px !important;text-align:center;background:#fff}
.customer-col{position:sticky;left:42px;z-index:2;width:236px !important;padding-right:18px !important;background:#fff;border-right:1px solid #edf1f5;box-shadow:7px 0 12px #2a3d5a06}
.customer-table td.customer-col + td{padding-left:14px !important}
.operation-col{position:sticky;right:0;z-index:4;width:220px !important;padding-left:14px !important;background:#fff;box-shadow:-18px 0 22px #2a3d5a0d}
.customer-table thead .check-cell,.customer-table thead .operation-col{background:#fff}
.customer-table thead .customer-col{background:#fff}
.customer-table tbody tr:hover .check-cell,.customer-table tbody tr:hover .customer-col,.customer-table tbody tr:hover .operation-col{background:#fbfdff}
.customer-table input[type=checkbox]{width:14px;height:14px;padding:0;accent-color:var(--primary);border-radius:4px;cursor:pointer}
.enable-col{width:96px;padding-left:14px !important}
.cooperation-col{width:160px;padding-left:20px !important}
.account-col{width:222px}
.account-col small{line-height:16px}
.block-reason{display:block;margin-top:4px;color:#c0575a;font-size:11px;line-height:15px;font-style:normal}
.block-reason.muted{color:#98a2b1}
.elec-col{width:132px}
.owner-col{width:164px}
.create-col{width:142px}
.customer-name{display:flex;align-items:center;gap:6px;min-width:0}
.customer-name .verified{color:#2f7ac9;flex:0 0 auto}
.customer-name .unverified{color:#c2ccda;flex:0 0 auto}
.customer-name b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cooperation-mode{color:#3a4658;font-weight:600}
.row-actions{display:flex;flex-wrap:wrap;gap:4px 10px;line-height:24px}
.row-actions button{height:24px;padding:0;color:var(--primary);font-size:12px;border:0;background:transparent;cursor:pointer;white-space:nowrap}
.row-actions button:hover{text-decoration:underline}
.row-actions button.disabled{color:#b6bdc9;cursor:not-allowed;text-decoration:none}

/* ---------- tag / switch ---------- */
.tag{width:fit-content;display:inline-flex;align-items:center;min-height:22px;padding:0 9px;border-radius:12px;font-size:11px;font-weight:500;line-height:22px;white-space:nowrap;border:0;background:#f1f4f8;color:#56657a}
.tag+.tag{margin-left:5px}
.tag-green{color:#4d8a3f;background:#e9f6e4}
.tag-blue{color:#45688f;background:#eaf1f8}
.tag-purple{color:#67558d;background:#f0ecf8}
.tag-orange{color:#a56b25;background:#fbf3e6}
.tag-red{color:#ae4e50;background:#faeeee}
.tag-gray{color:#697386;background:#f0f2f5}
.tag-cyan{color:#38787a;background:#eaf5f5}
.tag-solid.tag-blue{color:#fff;background:#4c79bd}
.tag-solid.tag-purple{color:#fff;background:#7b68a6}
.tag-dot:before{content:"";width:5px;height:5px;margin-right:6px;background:currentColor;border-radius:50%;opacity:.82}
.customer-status-switch{display:inline-flex;align-items:center;gap:7px;border:0;background:transparent;cursor:pointer;padding:0}
.customer-status-track{width:30px;height:17px;border-radius:10px;background:#c3cad4;display:inline-flex;align-items:center;padding:2px;transition:background .2s}
.customer-status-track i{width:13px;height:13px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(20,40,70,.2);transition:transform .2s}
.customer-status-switch.is-enabled .customer-status-track{background:var(--primary)}
.customer-status-switch.is-enabled .customer-status-track i{transform:translateX(13px)}
.customer-status-label{font-size:12px;color:#8a94a5}
.customer-status-switch.is-enabled .customer-status-label{color:#3a4658}

/* ---------- pagination ---------- */
.pagination{height:54px;display:flex;align-items:center;justify-content:flex-end;gap:8px;color:#697284;font-size:12px}
.pagination button{min-width:29px;height:29px;padding:0 8px;border:1px solid #e0e4eb;border-radius:10px;background:#fff;cursor:pointer;color:#5d6879}
.pagination button:hover:not(:disabled):not(.active){color:var(--primary);border-color:#a9c8f5}
.pagination button.active{color:#fff;background:var(--primary);border-color:var(--primary)}
.pagination button:disabled{color:#bcc4d0;cursor:not-allowed}
.pagination input{width:46px;height:29px;text-align:center;padding:0}
.pagination .select-wrap{width:80px}
.pagination select{height:29px;font-size:12px}
.pagination .page-nums{display:flex;gap:6px}

/* ---------- drawer ---------- */
.overlay{position:fixed;z-index:100;inset:0;background:#0000005c;display:flex}
.drawer{position:absolute;top:0;bottom:0;display:flex;flex-direction:column;background:#fff;min-width:900px;box-shadow:0 0 60px rgba(10,25,50,.22);animation:drawerIn .2s ease-out}
.drawer-left{left:0;width:60%}
.drawer-right{right:0;width:72%}
@keyframes drawerIn{0%{transform:translate(18px);opacity:.7}to{transform:translate(0);opacity:1}}
.drawer-left{animation-name:drawerInLeft}
@keyframes drawerInLeft{0%{transform:translate(-18px);opacity:.7}to{transform:translate(0);opacity:1}}
.drawer>header{flex:0 0 60px;padding:0 16px 0 22px;display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid #eef2f8}
.drawer>header .head-left{display:flex;align-items:center;gap:10px}
.drawer>header .head-left .icon{width:18px;height:18px;color:var(--primary)}
.drawer>header b{color:#2b3546;font-size:17px;font-weight:600}
.drawer>header small{color:#9aa6b8;font-size:11px;margin-left:8px}
.close{width:38px;height:38px;color:#7a86a1;background:#fff;border:1px solid #ebebeb;border-radius:50%;font-size:22px;font-weight:300;line-height:34px;cursor:pointer;padding:0}
.close:hover{color:var(--primary);border-color:#c8dcf4}
.drawer-body{flex:1;min-height:0;margin:0 10px;overflow:hidden;background:#fbfbfb;border-radius:14px 14px 0 0}
.drawer-body:has(.drawer-selectors){margin:0;border-radius:0;background:#f6f8fb}
.drawer>footer{flex:0 0 60px;padding:0 26px;display:flex;align-items:center;justify-content:flex-end;gap:10px;background:#fff;border-top:1px solid #f0f2f5}
.drawer>footer .foot-tip{margin-right:auto;color:#929cad;font-size:11px;max-width:60%;line-height:16px}

/* ---------- detail ---------- */
.drawer-layout{height:100%;display:grid;grid-template-columns:153px minmax(0,1fr);padding:20px 22px 22px 0;gap:12px;background:#f6f8fb}
.drawer-tabs{padding:14px 0}
.drawer-tabs button{width:100%;height:40px;margin:8px 0;padding:0 18px;display:flex;align-items:center;gap:9px;color:#4a5568;border:0;background:transparent;border-radius:12px;font-size:13px;text-align:left;cursor:pointer}
.drawer-tabs button:hover{background:#eef2f8}
.drawer-tabs button.active{color:var(--primary);font-weight:700;background:#fff;box-shadow:0 6px 16px rgba(30,58,104,.07)}
.drawer-tabs .icon{width:16px;height:16px;opacity:.9}
.detail-scroll{overflow:auto;padding-right:6px;min-height:0}
.detail-card{background:#fff;border-radius:22px;padding:0 28px 30px;box-shadow:0 5px 16px rgba(36,57,91,.05)}
.detail-hero{padding:24px 0 18px;border-bottom:1px solid #edf0f4}
.detail-hero h2{margin:0;color:#2b3546;font-size:19px;font-weight:600}
.detail-hero p{margin:7px 0 0;color:#8a94a5;font-size:11px}
.detail-hero .hero-tags{margin-top:13px;display:flex;gap:0}
.info-section{margin-top:26px}
.info-section h3{margin:0;padding:0 0 13px;color:#343c4e;border-bottom:1px solid #edf0f4;font-size:14px;font-weight:600}
.info-section h3 small{float:right;color:#9aa6b8;font-size:11px;font-weight:400}
.info-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 30px;padding-top:10px}
.info-grid>div{min-height:66px;padding:13px 0 10px}
.info-grid span{display:block;margin-bottom:8px;color:#8a94a5;font-size:11px;line-height:16px}
.info-grid b{display:block;color:#303a4c;font-size:12px;font-weight:500;line-height:19px;overflow-wrap:anywhere}
.info-grid b.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px}
.mini-table{width:100%;border-collapse:separate;border-spacing:0;font-size:12px;margin-top:8px}
.mini-table th{height:36px;padding:0 10px 0 0;color:#9ca8b8;font-weight:500;text-align:left;border-bottom:1px solid #e5ebf3}
.mini-table td{height:46px;padding:0 10px 0 0;border-bottom:1px solid #f1f4f9;color:#3a4658}
.mini-table tr:last-child td{border-bottom:0}
.timeline{margin-top:6px}
.timeline article{position:relative;display:grid;grid-template-columns:14px minmax(0,1fr);gap:14px;padding:14px 0}
.timeline article:before{content:"";position:absolute;left:4px;top:32px;bottom:-2px;width:1px;background:#e8edf4}
.timeline article:last-child:before{display:none}
.timeline i{width:9px;height:9px;margin-top:6px;border-radius:50%;background:#c8dcf4;border:2px solid #fff;box-shadow:0 0 0 1.5px #c8dcf4}
.timeline article.first i{background:var(--primary);box-shadow:0 0 0 1.5px var(--primary)}
.timeline b{color:#2e3a4d;font-size:13px;font-weight:600}
.timeline span{margin-left:10px;color:#9aa6b8;font-size:11px}
.timeline p{margin:6px 0 0;color:#7d8899;font-size:12px;line-height:18px}
.empty-panel{min-height:380px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px;color:#8f98a8}
.empty-panel .icon{width:46px;height:46px;opacity:.36}
.empty-panel b{color:#5d6a7d;font-size:15px;font-weight:600}
.empty-panel span{font-size:12px;color:#9aa6b8}

/* account card in detail */
.account-list-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px}
.account-list-heading b{color:#2e3a4d;font-size:14px;font-weight:600}
.account-list-heading small{display:block;margin-top:6px;color:#98a2b1;font-size:11px}
.matching-account-row{border:1px solid #e7ecf4;border-radius:20px;padding:18px 20px;margin-bottom:14px;background:#fff}
.matching-account-row.state-AUDIT_FAILED,.matching-account-row.state-SIGN_FAILED{border-color:#f3dcda;background:#fffdfd}
.acc-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.acc-head em{display:inline-grid;place-items:center;width:38px;height:38px;margin-right:12px;border-radius:12px;background:var(--primary-soft);color:var(--primary);font-style:normal;font-size:14px;font-weight:700;float:left}
.acc-head-main{display:flex;align-items:center;gap:0;min-width:0}
.acc-head-txt{min-width:0}
.acc-head-txt small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc-head b{color:#2b3546;font-size:14px;font-weight:600}
.acc-head small{display:block;margin-top:6px;color:#98a2b1;font-size:11px}
.acc-reason{margin-top:14px;padding:12px 14px;border-radius:14px;background:#fdf3f2;border:1px solid #f6dfdc}
.acc-reason b{color:#a8504c;font-size:12px;font-weight:600}
.acc-reason p{margin:6px 0 0;color:#8d6360;font-size:12px;line-height:18px}
.acc-reason button{margin-top:10px}
.acc-meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0 20px;margin-top:16px;padding-top:14px;border-top:1px dashed #e9eef5}
.acc-meta span{display:block;color:#98a2b1;font-size:11px;margin-bottom:7px}
.acc-meta b{display:block;color:#3a4658;font-size:12px;font-weight:500}
.acc-balance{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:16px}
.acc-balance article{padding:16px 18px;border-radius:16px;background:#f7faff;border:1px solid #e6eef9}
.acc-balance article span{color:#8a94a5;font-size:11px}
.acc-balance article strong{display:block;margin-top:8px;color:#1f2d3d;font-size:22px;font-weight:700;letter-spacing:-.2px}
.acc-balance article small{display:block;margin-top:7px;color:#9aa6b8;font-size:10px}
.acc-progress{margin-top:16px;padding:14px 16px;border-radius:14px;background:#f7f8fa;color:#6f7c8f;font-size:12px;line-height:20px}
.acc-fee{margin-top:16px;border:1px solid #e9eef5;border-radius:16px;padding:0 16px 14px}
.acc-fee header{height:46px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #f0f3f8}
.acc-fee header b{font-size:13px;color:#2e3a4d;font-weight:600}
.acc-fee header small{color:#9aa6b8;font-size:11px;margin-left:8px}
.acc-fee .fee-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0 16px;padding-top:12px}
.acc-fee .fee-grid span{display:block;color:#98a2b1;font-size:11px;margin-bottom:6px}
.acc-fee .fee-grid b{display:block;color:#3a4658;font-size:12px;font-weight:500}
.acc-fee footer{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;padding-top:12px;border-top:1px dashed #eef2f7}
.acc-fee footer small{color:#9aa6b8;font-size:11px;line-height:17px}
.contract-signing{margin-top:14px;border:1px solid #f2e4c8;background:#fffdf7;border-radius:16px;padding:16px}
.contract-signing header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.contract-signing header b{color:#8a6420;font-size:13px}
.contract-signing header small{display:block;margin-top:5px;color:#a08a63;font-size:11px;line-height:17px}
.contract-signing .link-row{margin-top:12px;display:flex;align-items:center;gap:10px;padding:10px 12px;background:#fff;border:1px solid #f0e6d4;border-radius:12px}
.contract-signing .link-row span{color:#9aa6b8;font-size:11px;white-space:nowrap}
.contract-signing .link-row a{color:var(--primary);font-size:11.5px;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.contract-signing .link-row a:hover{text-decoration:underline}

/* ---------- form drawer ---------- */
.drawer-selectors{min-height:53px;padding:0 22px;display:flex;align-items:center;gap:26px;background:#fff;border-bottom:1px solid #eef0f4}
.drawer-selectors .selector-title{color:#2f3d51;font-size:13px;font-weight:650}
.drawer-selectors label{display:flex;align-items:center;gap:7px;color:#596274;font-size:12px;cursor:pointer}
.drawer-selectors input[type=checkbox]{width:14px;height:14px;padding:0;accent-color:var(--primary);cursor:pointer}
.drawer-selectors>small{margin-left:auto;color:#98a2b1;font-size:11px}
.form-scroll{height:100%;min-height:0;overflow:auto;padding:18px 22px 26px}
.form-card{padding:26px 30px 34px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-content:start;gap:20px 30px;background:#fff;border:1px solid #e8edf4;border-radius:var(--panel-radius);box-shadow:0 8px 24px #2639540b}
.form-item{display:grid;grid-template-columns:92px minmax(0,1fr);align-items:start;column-gap:16px;min-width:0}
.form-item.wide{grid-column:1/-1}
.form-label{padding-top:9px;color:#525b6d;font-size:13px;text-align:left}
.form-label i{margin:0 0 0 3px;color:#e24e4e;font-style:normal}
.form-control{width:100%;min-width:0}
.form-control input,.form-control select{height:var(--control-height)}
.field-help{display:block;margin-top:7px;color:#989faf;font-size:11px;line-height:17px}
.form-section-title{grid-column:1/-1;min-height:44px;padding-bottom:12px;display:flex;align-items:flex-start;justify-content:space-between;border-bottom:1px solid #edf1f6;margin-top:6px}
.form-section-title b{color:#2e3a4d;font-size:15px;font-weight:650}
.form-section-title span{color:#98a2b1;font-size:11px;margin-top:2px}
.segmented{min-height:34px;display:inline-flex;overflow:hidden;border:1px solid var(--control-border);border-radius:14px;width:100%}
.segmented button{flex:1;min-width:0;height:32px;padding:0 10px;color:#626a7b;background:#fff;border:0;border-right:1px solid #e0e4ea;font-size:12px;cursor:pointer}
.segmented button:last-child{border-right:0}
.segmented button.active{color:#fff;background:var(--primary)}
.segmented button:disabled{cursor:not-allowed;color:#96a2b3;background:#f1f4f8;border-color:#e8edf3}
.segmented button:disabled.active{color:#fff;background:#a7b4c7}
.status-choice{min-height:34px;padding:3px;display:inline-flex;gap:3px;background:#f2f5f8;border:1px solid var(--control-border);border-radius:14px}
.status-choice button{min-width:62px;height:26px;border:0;background:transparent;border-radius:10px;color:#737e8f;font-size:12px;cursor:pointer}
.status-choice button.active{color:#fff;box-shadow:0 2px 7px #2a426221;background:var(--primary)}
.status-choice button.active.off{background:#788496}
.readonly-form-value{min-height:34px;padding:8px 12px;color:#4b586b;background:#f6f8fb;border:1px solid #e3e8ef;border-radius:14px;font-size:12px}
.form-card.is-readonly input,.form-card.is-readonly textarea{color:#4b586b;background:#f6f8fb;border-color:#e3e8ef;cursor:default}
.form-card.is-readonly .select-wrap select{color:#4b586b;background:#f6f8fb;border-color:#e3e8ef;cursor:default}
.form-card.is-readonly .select-chevron{opacity:.35}
.form-card.is-readonly .attachment-uploader{background:#f6f8fb;border-color:#e3e8ef;cursor:default}
.form-card.is-readonly .attachment-uploader em{color:#98a3b4}
.form-card.is-readonly .segmented{background:#f6f8fb;border-color:#e3e8ef}
.form-card.is-readonly .segmented button{color:#98a3b4;background:transparent}
.form-card.is-readonly .segmented button.active{color:#fff;background:#a7b4c7}
.cooperation-mode-decision{grid-column:1/-1;border:1px solid #c8dcf4;border-radius:20px;padding:18px 20px;background:linear-gradient(135deg,#f7fbff,#eef6ff)}
.mode-decision-kicker{color:#6f8cb5;font-size:10px;letter-spacing:.08em;font-weight:600}
.cooperation-mode-decision h3{margin:7px 0 0;color:#22354f;font-size:15px;font-weight:700}
.cooperation-mode-decision h3 i{color:#e24e4e;font-style:normal;margin-left:3px}
.cooperation-mode-decision p{margin:6px 0 0;color:#7d8fa7;font-size:11.5px;line-height:18px}
.mode-decision-note{margin-top:12px;color:#8a94a5;font-size:11px;line-height:17px}
.attachment-uploader{min-height:74px;padding:12px 14px;display:flex;align-items:center;gap:12px;background:#fafcff;border:1px dashed #c8d5e7;border-radius:18px;cursor:pointer}
.attachment-uploader:hover{background:#f5f9ff;border-color:#8fadd8}
.attachment-uploader .up-icon{width:32px;height:32px;border-radius:10px;background:#eef4fc;color:#4c79bd;display:grid;place-items:center;flex:0 0 auto}
.attachment-uploader b{color:#4a5a70;font-size:12px;font-weight:500}
.attachment-uploader small{display:block;margin-top:4px;color:#9aa6b8;font-size:11px}
.attachment-uploader em{margin-left:auto;color:var(--primary);font-size:11px;font-style:normal;white-space:nowrap}
.attachment-uploader.has-file{background:#f3f7fd;border-style:solid;border-color:#bdd0eb}
.attachment-field{grid-column:1/-1}
.bank-security-note{grid-column:1/-1;padding:11px 14px;border-radius:14px;background:#f7f9fc;color:#8a94a5;font-size:11px;line-height:17px}
.form-notice{grid-column:1/-1;min-height:56px;padding:13px 16px;display:flex;align-items:center;gap:12px;color:#72562b;background:#fff9ee;border:1px solid #f1dfba;border-radius:18px}
.form-notice b{font-size:12.5px;white-space:nowrap}
.form-notice small{color:#9c8054;font-size:11px;line-height:17px}

/* ---------- account drawer ---------- */
.open-step-strip{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:16px}
.open-step{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border:1px solid #e6ebf2;border-radius:16px;background:#fff}
.open-step em{width:24px;height:24px;flex:0 0 auto;display:grid;place-items:center;border-radius:50%;background:#eef2f8;color:#7a8798;font-style:normal;font-size:12px;font-weight:600}
.open-step b{color:#3a4658;font-size:13px;font-weight:600}
.open-step small{display:block;margin-top:5px;color:#9aa6b8;font-size:11px}
.open-step.active{border-color:#c8dcf4;background:#f6faff}
.open-step.active em{background:var(--primary);color:#fff}
.open-step.done em{background:#e7f3ec;color:#2f7d52}
.open-alert{display:flex;gap:12px;padding:13px 16px;margin-bottom:16px;border-radius:16px;background:#fdf3f2;border:1px solid #f6dfdc}
.open-alert .icon{color:#c4553f;flex:0 0 auto;margin-top:2px}
.open-alert b{color:#a8504c;font-size:12.5px}
.open-alert p{margin:6px 0 0;color:#8d6360;font-size:11.5px;line-height:18px}
.open-customer-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 24px;padding:18px 20px;background:#fff;border:1px solid #e9eef5;border-radius:18px;margin-bottom:16px}
.open-customer-summary span{display:block;color:#98a2b1;font-size:11px;margin-bottom:8px}
.open-customer-summary b{display:block;color:#303a4c;font-size:12.5px;font-weight:500;line-height:19px}
.open-customer-summary small{display:block;margin-top:6px;color:#9aa6b8;font-size:11px}
.open-columns{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;align-items:start}
.open-section-card{background:#fff;border:1px solid #e9eef5;border-radius:20px;padding:0 18px 18px}
.open-section-card header{height:52px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #f0f3f8;margin-bottom:14px}
.open-section-card header .ttl{display:flex;align-items:center;gap:9px}
.open-section-card header .ttl .icon{color:var(--primary);width:16px;height:16px}
.open-section-card header b{color:#2e3a4d;font-size:13.5px;font-weight:600}
.open-section-card header span{color:#9aa6b8;font-size:11px}
.open-section-card .form-item{grid-template-columns:84px minmax(0,1fr);column-gap:12px;margin-bottom:14px}
.open-section-card .form-label{padding-top:8px;font-size:12px}
.open-section-card input,.open-section-card select{height:34px}
.readonly-field{padding:10px 12px;border-radius:14px;background:#f6f8fb;border:1px solid #e3e8ef}
.readonly-field b{color:#5a6678;font-size:12px;font-weight:500}
.readonly-field small{display:block;margin-top:5px;color:#9aa6b8;font-size:11px;line-height:16px}
.config-rule-line{margin-top:4px;padding:11px 13px;border-radius:14px;background:#f7f9fc;color:#8a94a5;font-size:11px;line-height:17px}
.check-summary{color:#7b8797;font-size:11px}
.material-check-list article{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:10px;padding:11px 12px;border:1px solid #eaeff6;border-radius:14px;margin-bottom:9px;align-items:flex-start}
.material-check-list article .mark{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:#e7f3ec;color:#2f7d52;font-size:11px;font-weight:700}
.material-check-list article .mark .icon{width:11px;height:11px;stroke-width:2.4}
.material-check-list article.missing{border-color:#f4dedb;background:#fffdfd}
.material-check-list article.missing .mark{background:#fbeceb;color:#c4553f}
.material-check-list article b{color:#3a4658;font-size:12px;font-weight:600}
.material-check-list article b em{margin-left:7px;padding:1px 6px;border-radius:7px;background:#f1f5fa;color:#8fa0b6;font-style:normal;font-size:10px;font-weight:500}
.material-check-list article small{display:block;margin-top:5px;color:#98a2b1;font-size:11px;line-height:16px}
.material-check-list article strong{color:#2f7d52;font-size:11px;font-weight:600;white-space:nowrap}
.material-check-list article.missing strong{color:#c4553f}
.material-check-result{margin-top:4px;padding:10px 12px;border-radius:12px;background:#f2f8f4;color:#3f7a5c;font-size:11px;line-height:17px}
.material-check-result.bad{background:#fdf3f2;color:#a8504c}
.supplement-note{color:#9aa6b8;font-size:11px;line-height:17px;margin-bottom:12px}
.uploader{display:flex;align-items:center;gap:12px;min-height:64px;padding:11px 13px;border:1px dashed #c8d5e7;border-radius:14px;background:#fafcff;cursor:pointer;margin-bottom:10px}
.uploader:hover{background:#f5f9ff;border-color:#8fadd8}
.uploader .up-icon{width:30px;height:30px;border-radius:9px;background:#eef4fc;color:#4c79bd;display:grid;place-items:center;flex:0 0 auto}
.uploader b{color:#4a5a70;font-size:12px;font-weight:500}
.uploader small{display:block;margin-top:4px;color:#9aa6b8;font-size:11px}
.uploader .up-action{margin-left:auto;color:var(--primary);font-size:11px;white-space:nowrap}
.uploader.has-file{background:#f3f7fd;border-style:solid;border-color:#bdd0eb}
.open-rule-note{padding:12px 14px;border-radius:14px;background:#f7f9fc;border:1px solid #eef2f7;color:#7d8899;font-size:11px;line-height:17px;margin-top:4px}
.open-rule-note b{color:#5f6c80;font-size:11.5px}
.open-confirm-layout{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
.open-confirm-layout .full{grid-column:1/-1}
.confirm-block{background:#fff;border:1px solid #e9eef5;border-radius:18px;padding:0 18px 16px}
.confirm-block header{height:46px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #f0f3f8;margin-bottom:12px}
.confirm-block header b{color:#2e3a4d;font-size:13px;font-weight:600}
.confirm-block header span{color:#9aa6b8;font-size:11px}
.confirm-block dl{margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 18px}
.confirm-block dl>div{min-width:0}
.confirm-block dt{color:#98a2b1;font-size:11px;margin-bottom:6px}
.confirm-block dd{margin:0;color:#3a4658;font-size:12px;line-height:18px;word-break:break-all}
.confirm-warning{grid-column:1/-1;padding:13px 16px;border-radius:16px;background:#fff9ee;border:1px solid #f1dfba}
.confirm-warning b{color:#8a6420;font-size:12px}
.confirm-warning small{display:block;margin-top:6px;color:#a08a63;font-size:11px;line-height:17px}
.chip-list{display:flex;flex-direction:column;gap:8px}
.chip{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:12px;background:#f7f9fc}
.chip b{color:#465468;font-size:11.5px;font-weight:600;white-space:nowrap}
.chip small{color:#9aa6b8;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.open-success{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:40px}
.open-success .ok-mark{width:64px;height:64px;border-radius:50%;background:#e9f5ee;color:#2f7d52;display:grid;place-items:center}
.open-success .ok-mark .icon{width:30px;height:30px;stroke-width:2.2}
.open-success h2{margin:20px 0 0;color:#2b3546;font-size:19px;font-weight:600}
.open-success p{margin:10px 0 0;max-width:560px;text-align:center;color:#8a94a5;font-size:12px;line-height:20px}
.open-success .kv{margin-top:22px;width:min(520px,100%);padding:16px 20px;border-radius:18px;background:#fff;border:1px solid #e9eef5}
.open-success .kv div{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;line-height:30px}
.open-success .kv dt{color:#98a2b1;font-size:12px}
.open-success .kv dd{margin:0;color:#3a4658;font-size:12px}

/* ---------- modal ---------- */
.modal-overlay{position:fixed;z-index:200;inset:0;background:#0000005c;display:grid;place-items:center}
.modal{width:610px;max-height:calc(100vh - 86px);display:flex;flex-direction:column;overflow:hidden;background:#fff;border-radius:var(--panel-radius);box-shadow:0 14px 42px #101c313d;animation:modalIn .18s ease-out}
.modal.wide{width:880px}
@keyframes modalIn{0%{transform:translateY(-8px) scale(.99);opacity:.5}to{transform:none;opacity:1}}
.modal>header{flex:0 0 58px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #edf1f6}
.modal>header .mh{display:flex;align-items:center;gap:9px}
.modal>header .mh .icon{color:var(--primary);width:17px;height:17px}
.modal>header b{color:#2b3546;font-size:17px;font-weight:600}
.modal-body{padding:24px 30px 28px;overflow:auto}
.modal>footer{flex:0 0 62px;padding:0 24px;display:flex;align-items:center;justify-content:flex-end;gap:10px;border-top:1px solid #edf1f6}
.modal-footer-tip{margin-right:auto;color:#929cad;font-size:11px}
.action-confirm-heading{display:flex;gap:12px;align-items:flex-start}
.action-confirm-heading .ci{width:36px;height:36px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary)}
.action-confirm-heading .ci.danger{background:#fdf0ef;color:#c4553f}
.action-confirm-heading b{display:block;color:#2b3546;font-size:15px;font-weight:600;line-height:22px}
.action-confirm-heading small{display:block;margin-top:6px;color:#8a94a5;font-size:12px;line-height:18px}
.action-confirm-target{margin-top:18px;padding:14px 16px;border-radius:16px;background:#f7f9fc}
.action-confirm-target .trow{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;line-height:26px}
.action-confirm-target .trow span{color:#98a1ae;font-size:12px}
.action-confirm-target .trow b{color:#465468;font-size:12px;font-weight:500}
.reason-field{margin-top:16px}
.reason-field label{display:flex;align-items:center;gap:4px;color:#525b6d;font-size:12px;margin-bottom:8px}
.reason-field label i{color:#e24e4e;font-style:normal}
.reason-field textarea{min-height:78px}
.reason-meta{display:flex;justify-content:space-between;gap:12px;margin-top:7px;color:#9aa6b8;font-size:11px}
.reason-meta .err{color:#c4553f}
.action-confirm-warning{display:flex;gap:10px;margin-top:16px;padding:11px 14px;border-radius:14px;background:#fff9ee;border:1px solid #f1dfba;color:#8a6a30;font-size:11px;line-height:17px}
.action-confirm-warning .icon{flex:0 0 auto;margin-top:1px;color:#c08a2a}
.btn.danger{color:#fff;background:#c4553f;border-color:#c4553f}
.btn.danger:hover{background:#a94733;color:#fff}

/* ---------- toast ---------- */
#toastWrap{position:fixed;z-index:400;left:50%;top:22px;transform:translateX(-50%);display:flex;flex-direction:column;gap:10px;align-items:center;pointer-events:none}
.toast{min-height:40px;padding:0 18px;display:flex;align-items:center;gap:9px;border-radius:14px;background:#22304a;color:#fff;font-size:12.5px;box-shadow:0 12px 30px rgba(18,32,55,.26);animation:toastIn .22s ease-out}
.toast .icon{width:15px;height:15px;color:#7fe0a8}
@keyframes toastIn{0%{transform:translateY(-10px);opacity:0}to{transform:none;opacity:1}}

/* ---------- 多页面 ---------- */
.page{display:block}
.page.hidden{display:none}
/* 新页面无勾选列，首列贴左固定 */
.page:not(#page-customer) .customer-col{left:0;box-shadow:none}
.page:not(#page-customer) .customer-table td,.page:not(#page-customer) .customer-table th{padding-left:0}
.page:not(#page-customer) .customer-table th:first-child,.page:not(#page-customer) .customer-table td:first-child{padding-left:4px}
.page:not(#page-customer) .operation-col{width:auto}

/* ---------- 运营商：多页签表单 / 证照 / 记录卡 ---------- */
.agent-pane.hidden{display:none}
.agent-scope{display:flex;align-items:center;justify-content:space-between;gap:18px;margin:0 0 12px;padding:12px 16px;background:#fff;border:1px solid #e9eef5;border-radius:16px}
.agent-scope b{display:block;color:#2f3a4c;font-size:13px;font-weight:600}
.agent-scope small{display:block;margin-top:4px;color:#9aa6b8;font-size:11px;line-height:16px}
.agent-scope-checks{display:flex;gap:16px;flex:0 0 auto}
.agent-scope-checks label{display:inline-flex;align-items:center;gap:6px;color:#4b586b;font-size:12px;cursor:pointer;white-space:nowrap}
.agent-form-wrap{height:100%;display:flex;flex-direction:column;padding:14px 16px 0;background:#f6f8fb}
.agent-form-layout{flex:1;min-height:0;display:grid;grid-template-columns:178px minmax(0,1fr);gap:12px;padding-bottom:14px}
.agent-form-aside{display:flex;flex-direction:column;gap:6px;padding-top:2px;overflow:auto}
.agent-form-aside button{display:flex;align-items:center;gap:9px;min-height:56px;padding:8px 12px;border:0;background:transparent;border-radius:12px;text-align:left;cursor:pointer;color:#4a5568}
.agent-form-aside button:hover{background:#eef2f8}
.agent-form-aside button.active{background:#fff;box-shadow:0 6px 16px rgba(30,58,104,.07);color:var(--primary)}
.agent-form-aside button .idx{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;background:#e6ecf5;color:#68768c;font-size:11px;font-weight:600}
.agent-form-aside button.active .idx{background:var(--primary);color:#fff}
.agent-form-aside button b{display:block;color:inherit;font-size:12.5px;font-weight:600}
.agent-form-aside button small{display:block;margin-top:3px;color:#98a2b1;font-size:10.5px;line-height:15px}
.agent-form-main{min-width:0;overflow:auto}
.agent-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 24px;padding:20px 22px 26px;background:#fff;border:1px solid #e8edf4;border-radius:20px}
.agent-switches{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.agent-switch-card{border:1px solid #e9eef5;border-radius:14px;padding:11px 13px;background:#fcfdff;display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.agent-switch-card b{display:block;color:#3a4658;font-size:12.5px;font-weight:600}
.agent-switch-card small{display:block;margin-top:4px;color:#9aa6b8;font-size:11px;line-height:16px}
.agent-switch{flex:0 0 auto;width:38px;height:22px;border-radius:11px;background:#dfe5ee;border:0;position:relative;cursor:pointer;transition:.18s}
.agent-switch i{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(20,40,70,.2);transition:.18s}
.agent-switch.on{background:var(--primary)}
.agent-switch.on i{transform:translateX(16px)}
.agent-dependent{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 24px}
.agent-dependent.hidden{display:none}
.agent-lic-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:14px}
.agent-lic{border:1px solid #eaeff6;border-radius:14px;padding:12px 14px;background:#fcfdff}
.agent-lic>span{display:block;color:#8a94a5;font-size:11px;margin-bottom:8px}
.agent-lic div{display:flex;align-items:center;gap:8px;color:#3a4658;font-size:12px}
.agent-lic small{display:block;color:#a4aebd;font-size:11px;margin-top:5px}
.agent-lic.empty div{color:#a4aebd}
.agent-record{border:1px solid #eaeff6;border-radius:16px;padding:14px 16px;background:#fcfdff;margin-top:12px}
.agent-record-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding-bottom:12px;border-bottom:1px dashed #edf1f7}
.agent-record-head b{color:#2f3a4c;font-size:13px;font-weight:600}
.agent-record-head span{display:block;margin-top:5px;color:#9aa6b8;font-size:11px}
.agent-record-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 18px;padding-top:12px}
.agent-record-grid>div span{display:block;color:#8a94a5;font-size:11px;margin-bottom:6px}
.agent-record-grid>div b{color:#303a4c;font-size:12px;font-weight:500;overflow-wrap:anywhere}
.agent-record-foot{margin-top:14px}
.agent-balance{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:14px}
.agent-balance>div{border:1px solid #edf1f7;border-radius:14px;padding:12px 14px;background:#fafcff}
.agent-balance span{display:block;color:#8a94a5;font-size:11px}
.agent-balance b{display:block;margin:6px 0 4px;color:#1f5dbc;font-size:18px;font-weight:600}
.agent-balance small{color:#a4aebd;font-size:11px;line-height:16px}
.agent-fee{margin-top:14px;border:1px solid #eef2f8;border-radius:14px;padding:13px 15px;background:#fbfcfe}
.agent-fee-head{display:flex;align-items:center;gap:10px;color:#3a4658;font-size:12.5px}
.agent-fee-head b{font-weight:600}
.agent-fee-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 18px;margin-top:14px}
.agent-fee-grid>div span{display:block;color:#8a94a5;font-size:11px;margin-bottom:5px}
.agent-fee-grid>div b{color:#303a4c;font-size:12px;font-weight:500;overflow-wrap:anywhere}
.customer-name .tag{flex:0 0 auto}
.agent-empty{margin-top:12px;padding:26px;text-align:center;color:#98a2b1;font-size:12px;border:1px dashed #e6ecf5;border-radius:14px;background:#fcfdff}
.btn.small{height:28px;padding:0 12px;font-size:12px}

/* ---- 认证信息表单（截图版式） ---- */
.form-item.lg{grid-template-columns:118px minmax(0,1fr)}
.cert-banner{grid-column:1/-1;min-height:50px;padding:12px 16px;display:flex;align-items:center;gap:10px;background:#eef5ff;border:1px solid #d7e6fb;border-radius:14px;cursor:pointer;margin:0}
.cert-banner input{width:14px;height:14px;margin:0;accent-color:var(--primary);flex:0 0 auto;cursor:pointer}
.cert-banner-txt b{display:block;color:var(--primary);font-size:13px;font-weight:650}
.cert-banner-txt small{display:block;margin-top:2px;color:#7d92b5;font-size:11px}
.cert-group{grid-column:1/-1;padding:16px;background:#f5f7fa;border:1px solid #edf1f6;border-radius:18px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.cert-group-head{grid-column:1/-1}
.cert-group-head b{color:#2e3a4d;font-size:13px;font-weight:650}
.cert-group-head small{display:block;margin-top:3px;color:#98a2b1;font-size:11px}
.cert-up-card{background:#fff;border:1px solid #e9edf3;border-radius:14px;padding:14px 16px 12px;min-width:0}
.cert-up-head{color:#2e3a4d;font-size:13px;font-weight:650}
.cert-up-head i{color:#e24e4e;font-style:normal;margin-left:2px}
.cert-drop{margin-top:10px;min-height:132px;padding:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:#fff;border:1px solid #e3e9f1;border-radius:10px;cursor:pointer;text-align:center}
.cert-drop.dashed{border:1px dashed #b9c9e2}
.cert-drop:hover,.cert-file-row:hover{background:#f8fbff;border-color:#9db9e4}
.cert-drop .icon{width:18px;height:18px;color:#4c79bd}
.cert-drop-link{color:var(--primary);font-size:12px}
.cert-up-note{display:block;margin-top:8px;color:#a3adbd;font-size:11px}
.cert-id-mock{width:82%;max-width:300px;padding:14px 16px;display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #eef2f7;border-radius:10px;box-shadow:0 6px 16px rgba(30,58,104,.07)}
.cim-ic{width:36px;height:36px;flex:0 0 auto;border-radius:10px;background:#e9f1fc;color:#4c79bd;display:grid;place-items:center}
.cim-ic .icon{width:18px;height:18px}
.cim-lines{flex:1;min-width:0}
.cim-lines i{display:block;height:5px;border-radius:3px;background:#e4eaf2;margin:7px 0}
.cim-lines i:first-child{width:88%}
.cert-file-row{margin-top:10px;min-height:64px;padding:12px 16px;display:flex;align-items:center;gap:12px;background:#fff;border:1px dashed #b9c9e2;border-radius:12px;cursor:pointer}
.cfr-ic{width:34px;height:34px;flex:0 0 auto;border-radius:10px;background:#e9f1fc;color:#4c79bd;display:grid;place-items:center}
.cfr-ic .icon{width:17px;height:17px}
.cfr-txt{flex:1;min-width:0}
.cfr-txt b{display:block;color:#3f4c61;font-size:12.5px;font-weight:600}
.cfr-txt small{display:block;margin-top:3px;color:#9aa6b8;font-size:11px}
.cert-file-row em{margin-left:auto;color:var(--primary);font-size:12px;font-style:normal;white-space:nowrap}
.form-card textarea.form-area{min-height:96px;padding:8px 12px;resize:vertical;line-height:20px}
.attach-head{margin-bottom:8px;color:#2e3a4d;font-size:13px;font-weight:650}
.req-star{margin-left:2px;color:#e24e4e;font-style:normal}
.req-star[hidden]{display:none}

/* ---------- 嵌入模式：被「万油通运营平台 → 充电业务」iframe 承载时（URL 带 ?embed=1） ----------
   隐藏本原型自带的左侧菜单与顶栏，页面主体铺满；不带该参数单独打开时行为完全不变 */
html.embed-mode,html.embed-mode body{min-width:0;overflow:hidden}
html.embed-mode .side-nav{display:none}
html.embed-mode .top-header{display:none}
html.embed-mode .main-shell{margin-left:0;height:100vh;min-height:0;display:flex;flex-direction:column}
html.embed-mode .content{height:auto;flex:1;min-height:0;padding:18px 22px 26px;overflow:auto}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2 4.5 13.2h6L11 22l8.5-11.2h-6L13 2Z"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.4"/><path d="M3 20c0-3.3 2.7-5.4 6-5.4S15 16.7 15 20"/><path d="M16.5 5.2a3 3 0 0 1 0 5.6"/><path d="M18 14.6c2 .6 3.4 2.2 3.4 4.4"/></symbol>
  <symbol id="i-station" viewBox="0 0 24 24"><path d="M12 21s6-5.1 6-10a6 6 0 1 0-12 0c0 4.9 6 10 6 10Z"/><circle cx="12" cy="11" r="2.2"/></symbol>
  <symbol id="i-box" viewBox="0 0 24 24"><path d="M20 8.5 12 4 4 8.5v7L12 20l8-4.5v-7Z"/><path d="M4 8.5 12 13l8-4.5M12 13v7"/></symbol>

  <symbol id="i-wallet" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18"/><circle cx="16.5" cy="14.5" r="1.2"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3.5H7a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8.5L14 3.5Z"/><path d="M14 3.5v5h5M8.5 13h7M8.5 16.5h4"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></symbol>

  <symbol id="i-contract" viewBox="0 0 24 24"><path d="M15 3.5H6.5a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2H10"/><path d="M15 3.5 19.5 8v3"/><path d="M14.5 19.5c3-1 5-3.4 5-6.2 0-1.2-.8-2-1.8-2-1.4 0-2.4 1.4-2.4 2.6 0 2 2 3.8 4.2 4.4"/></symbol>
  <symbol id="i-bank" viewBox="0 0 24 24"><path d="M3.5 9.5 12 4l8.5 5.5"/><path d="M5.5 9.5v8M9.8 9.5v8M14.2 9.5v8M18.5 9.5v8M3.5 20h17"/></symbol>
  <symbol id="i-qr" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="6" height="6" rx="1.2"/><rect x="14.5" y="3.5" width="6" height="6" rx="1.2"/><rect x="3.5" y="14.5" width="6" height="6" rx="1.2"/><path d="M14.5 14.5h2.5v2.5h-2.5zM19 14.5h1.5M14.5 19h1.5M18 18h2.5v2.5H18z"/></symbol>
  <symbol id="i-log" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 5v6h-6"/></symbol>

<div class="app-shell">
  <aside class="side-nav">
    <div class="side-logo">
      <span class="logo-badge"><svg class="icon"><use href="#i-bolt"/></svg></span>
      <b>万油通<em>运营中台 · 电业务</em></b>
    </div>
    <nav class="full-menu" id="menu">
      <div class="menu-group">
        <button class="menu-parent is-open" data-group="customer">
          <svg class="icon"><use href="#i-users"/></svg><span>客户中心</span><i class="menu-chevron"></i>
        </button>
        <div class="menu-children">
          <button class="active" data-page="customer">客户管理</button>
          <button data-page="cert">客户认证管理</button>
          <button data-page="contract">客户合同管理</button>
          <button data-page="bank">客户银行卡管理</button>
        </div>
      </div>
      <div class="menu-group">
        <button class="menu-parent" data-group="station">
          <svg class="icon"><use href="#i-station"/></svg><span>运营商中心</span><i class="menu-chevron"></i>
        </button>
        <div class="menu-children hidden">
          <button data-page="agent">运营商管理</button>
          <button data-page="agentcert">运营商认证</button>
          <button data-page="agentcontract">运营商合同管理</button>
          <button data-page="agentbank">运营商银行卡管理</button>
          <button data-page="site">充电站点管理</button>
          <button data-page="pile">充电桩管理</button>
          <button data-page="gun">充电枪管理</button>
        </div>
      </div>
      <div class="menu-group">
        <button class="menu-parent" data-group="goods">
          <svg class="icon"><use href="#i-box"/></svg><span>商品中心</span><i class="menu-chevron"></i>
        </button>
        <div class="menu-children hidden">
          <button data-soon="网点电价管理">网点电价管理<span class="soon">待建</span></button>
        </div>
      </div>
      <div class="menu-group">
        <button class="menu-parent" data-group="order">
          <svg class="icon"><use href="#i-order"/></svg><span>订单中心</span><i class="menu-chevron"></i>
        </button>
        <div class="menu-children hidden">
          <button data-soon="充电订单管理">充电订单管理<span class="soon">待建</span></button>
        </div>
      </div>
      <div class="menu-group">
        <button class="menu-parent" data-group="finance">
          <svg class="icon"><use href="#i-wallet"/></svg><span>财务中心</span><i class="menu-chevron"></i>
        </button>
        <div class="menu-children hidden">
          <button data-page="trade">账户交易</button>
          <button data-soon="电账户管理">电账户管理<span class="soon">待建</span></button>
          <button data-soon="对账单管理">对账单管理<span class="soon">待建</span></button>
        </div>
      </div>
    </nav>
  </aside>

  <div class="main-shell">
    <header class="top-header">
      <div class="page-title" id="pageTitle">
        <svg class="icon entry-mark"><use href="#i-users"/></svg>
        <b>客户管理</b><small>撮合模式</small>
      </div>
      <div class="header-actions">
        <span class="hint">电业务与油气业务相互独立</span>
        <span class="profile">运营</span>
      </div>
    </header>

    <main class="content" id="content">
      <section class="page" id="page-customer">
      <section class="filter-card">
        <div class="filter-grid">
          <label class="filter-item"><span>客户名称</span>
            <input id="fName" placeholder="请输入客户名称" autocomplete="off" />
          </label>
          <label class="filter-item"><span>客户性质</span>
            <div class="select-wrap">
              <select id="fNature">
                <option value="">请选择</option>
                <option value="标准客户">标准客户</option>
                <option value="虚拟客户">虚拟客户</option>
                <option value="KA客户">KA客户</option>
              </select>
              <svg class="icon select-chevron"><use href="#i-chev"/></svg>
            </div>
          </label>
          <label class="filter-item"><span>撮合账户状态</span>
            <div class="select-wrap">
              <select id="fAccount">
                <option value="">请选择</option>
                <option value="UNOPENED">未开户</option>
                <option value="PENDING_AUDIT">待审核</option>
                <option value="AUDIT_FAILED">审核失败</option>
                <option value="PENDING_SIGN">待签约</option>
                <option value="SIGN_FAILED">签约失败</option>
                <option value="ACTIVE">开户成功</option>
              </select>
              <svg class="icon select-chevron"><use href="#i-chev"/></svg>
            </div>
          </label>
          <label class="filter-item"><span>认证状态</span>
            <div class="select-wrap">
              <select id="fAuth">
                <option value="">请选择</option>
                <option value="认证通过">认证通过</option>
                <option value="未认证">未认证</option>
                <option value="认证不通过">认证不通过</option>
              </select>
              <svg class="icon select-chevron"><use href="#i-chev"/></svg>
            </div>
          </label>
          <label class="filter-item"><span>客户等级</span>
            <div class="select-wrap">
              <select id="fLevel">
                <option value="">请选择</option>
                <option value="总公司">总公司</option>
                <option value="分公司">分公司</option>
                <option value="三级公司">三级公司</option>
              </select>
              <svg class="icon select-chevron"><use href="#i-chev"/></svg>
            </div>
          </label>
          <label class="filter-item"><span>业务归属</span>
            <input id="fOwner" placeholder="姓名 / 部门" autocomplete="off" />
          </label>
        </div>

        <div class="filter-extra hidden" id="filterExtra">
          <div class="filter-grid">
            <label class="filter-item"><span>客户标签</span>
              <div class="select-wrap">
                <select id="fTag">
                  <option value="">请选择</option>
                  <option value="撮合试点">撮合试点</option>
                  <option value="集团客户">集团客户</option>
                  <option value="新签客户">新签客户</option>
                  <option value="存量客户">存量客户</option>
                </select>
                <svg class="icon select-chevron"><use href="#i-chev"/></svg>
              </div>
            </label>
            <label class="filter-item"><span>运营负责人</span>
              <input id="fOperation" placeholder="请输入负责人" autocomplete="off" />
            </label>
            <label class="filter-item"><span>商务负责人</span>
              <input id="fBusiness" placeholder="请输入负责人" autocomplete="off" />
            </label>
          </div>
        </div>

        <div class="filter-footer">
          <button class="more-filter" id="moreBtn">更多筛选 ↓</button>
          <div class="filter-actions">
            <button class="btn" id="resetBtn">重置</button>
            <button class="btn primary" id="searchBtn"><svg class="icon" style="width:14px;height:14px"><use href="#i-search"/></svg>搜索</button>
          </div>
        </div>
      </section>

      <section class="panel-card">
        <div class="panel-toolbar">
          <div>
            <button class="btn primary" id="addBtn"><b>＋</b>新增</button>
            <button class="btn" id="exportBtn">导出</button>
          </div>
          <span id="countTip">共 0 条</span>
        </div>

        <div class="table-scroll">
          <table class="customer-table">
            <colgroup>
              <col style="width:42px" /><col style="width:236px" />
              <col style="width:96px" /><col style="width:160px" />
              <col style="width:222px" /><col style="width:172px" />
              <col style="width:148px" /><col style="width:220px" />
            </colgroup>
            <thead>
              <tr>
                <th class="check-cell"><input type="checkbox" id="checkAll" aria-label="选择全部客户" /></th>
                <th class="customer-col">客户信息</th>
                <th class="enable-col">启用状态</th>
                <th class="cooperation-col">合作与组织</th>
                <th class="account-col">撮合开户与认证</th>
                <th class="owner-col">业务归属</th>
                <th class="create-col">创建信息</th>
                <th class="operation-col">操作</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>

        <div class="pagination" id="pagination"></div>
      </section>
      </section>

        if (c.auth !== "认证通过") blocks.push(c.auth === "未认证" ? "认证未完成" : (c.auth === "审核中" ? "认证审核中" : c.auth));
        var canOpen = c.enabled && c.auth === "认证通过" && !accountOpened;
        var accNote = {
          ACTIVE: "已开通撮合账户，无需重复开户",
          PENDING_AUDIT: "开户审核中，暂不可重复开户",
          PENDING_SIGN: "开户待签约，需完成签约"
        }[c.account] || "";
        var blockHtml = (!accountOpened && blocks.length)
          ? '<em class="block-reason">不可开户：' + blocks.join("、") + "</em>"
          : (accountOpened && accNote ? '<em class="block-reason muted">' + accNote + "</em>" : "");
        return "<tr data-id=\"" + c.id + "\">" +
          '<td class="check-cell"><input type="checkbox" data-check="' + c.id + '"' + checked + ' aria-label="选择' + c.name + '" /></td>' +
          '<td class="customer-col"><div class="customer-name">' + verified + "<b>" + c.name + "</b></div><small>" + c.id + " · " + c.nature + "</small></td>" +
          '<td class="enable-col"><button class="customer-status-switch' + (c.enabled ? " is-enabled" : "") + '" role="switch" aria-checked="' + c.enabled + '" data-switch="' + c.id + '"><span class="customer-status-track"><i></i></span><span class="customer-status-label">' + (c.enabled ? "启用" : "停用") + "</span></button></td>" +
          '<td class="cooperation-col"><b class="cooperation-mode">' + modeText(c.mode) + "</b><small>" + orgLine + "</small></td>" +
          '<td class="account-col">' + accountTag(c) + "<small>" + authLine + "</small>" + blockHtml + "</td>" +
          '<td class="owner-col"><b>' + c.owner + "-" + c.ownerPhone + "</b><small>" + c.ownerDept + " · " + c.business + "</small></td>" +
          '<td class="create-col"><b>' + c.creator + "</b><small>" + c.createTime + "</small></td>" +
          '<td class="operation-col"><div class="row-actions">' +
            '<button data-act="edit" data-id="' + c.id + '">修改</button>' +
            '<button data-act="detail" data-id="' + c.id + '">详情</button>' +
            '<button data-act="copy" data-id="' + c.id + '">复制</button>' +
            '<button data-act="account" data-id="' + c.id + '"' + (canOpen ? "" : ' class="disabled"') + ">撮合开户</button>" +
          "</div></td></tr>";
      }).join("");
    }

    renderPagination(total, maxPage);
    updateSelectionUI(rows);
  }

  function renderPagination(total, maxPage) {
    var pages = [];
    for (var i = 1; i <= maxPage; i++) pages.push(i);
    document.getElementById("pagination").innerHTML =
      "<span>共 " + total + " 条</span>" +
      '<div class="select-wrap" style="width:80px"><select id="pageSize">' +
        [10, 20, 50].map(function (n) { return '<option value="' + n + '"' + (n === state.pageSize ? " selected" : "") + ">每页 " + n + "</option>"; }).join("") +
      "</select><svg class=\"icon select-chevron\"><use href=\"#i-chev\"/></svg></div>" +
      '<button id="prevPage"' + (state.page === 1 ? " disabled" : "") + ">上一页</button>" +
      '<div class="page-nums">' + pages.map(function (p) {
        return '<button data-page="' + p + '"' + (p === state.page ? ' class="active"' : "") + ">" + p + "</button>";
      }).join("") + "</div>" +
      '<button id="nextPage"' + (state.page === maxPage ? " disabled" : "") + ">下一页</button>" +
      "<span>前往</span><input id=\"gotoPage\" value=\"" + state.page + "\" /><span>页</span>";
  }

  function updateSelectionUI(rows) {
    var tip = document.getElementById("countTip");
    var ids = Object.keys(state.selected).filter(function (k) { return state.selected[k]; });
    if (tip) tip.innerHTML = "已选择 <b>" + ids.length + "</b> 项　共 " + getFiltered().length + " 条";
    var all = document.getElementById("checkAll");
    if (!all) return;
    var visibleIds = (rows || []).map(function (r) { return r.id; });
    var visibleChecked = visibleIds.filter(function (id) { return state.selected[id]; });
    all.checked = visibleIds.length > 0 && visibleChecked.length === visibleIds.length;
    all.indeterminate = visibleChecked.length > 0 && visibleChecked.length < visibleIds.length;
  }

  /* ============ 筛选交互 ============ */
  function bindFilters() {
    var map = { fName: "name", fAccount: "account", fAuth: "auth", fLevel: "level", fOwner: "owner", fNature: "nature", fTag: "tag", fOperation: "operation", fBusiness: "business" };
    Object.keys(map).forEach(function (id) {
      var el = document.getElementById(id);
      var key = map[id];
      var handler = function () {
        state.filters[key] = el.value;
        state.page = 1;
        render();
      };
      el.addEventListener("input", handler);
      el.addEventListener("change", handler);
    });

    document.getElementById("moreBtn").addEventListener("click", function () {
      state.moreOpen = !state.moreOpen;
      document.getElementById("filterExtra").classList.toggle("hidden", !state.moreOpen);
      this.textContent = state.moreOpen ? "收起筛选 ↑" : "更多筛选 ↓";
    });

    document.getElementById("resetBtn").addEventListener("click", function () {
      Object.keys(map).forEach(function (id) { document.getElementById(id).value = ""; });
      state.filters = { name: "", account: "", auth: "", level: "", owner: "", nature: "", tag: "", operation: "", business: "" };
      state.page = 1;
      render();
      toast("筛选条件已重置");
    });

    document.getElementById("searchBtn").addEventListener("click", function () {
      state.page = 1;
      render();
      toast("已按当前条件筛选，共 " + getFiltered().length + " 条");
    });

    document.getElementById("exportBtn").addEventListener("click", function () {
      var sel = customers.filter(function (c) { return state.selected[c.id]; });
      var n = sel.length || getFiltered().length;
      toast("已生成导出任务：客户管理· " + n + " 条" + (sel.length ? "（按已勾选）" : "（按当前筛选结果）"));
    });
  }

  /* ============ 列表事件 ============ */
  function bindTable() {
    document.getElementById("tbody").addEventListener("change", function (e) {
      var cb = e.target.closest("input[data-check]");
      if (!cb) return;
      state.selected[cb.getAttribute("data-check")] = cb.checked;
      updateSelectionUI(getFiltered().slice((state.page - 1) * state.pageSize, state.page * state.pageSize));
    });

    var checkAllEl = document.getElementById("checkAll");
    if (checkAllEl) checkAllEl.addEventListener("change", function () {
      var on = this.checked;
      var list = getFiltered();
      var start = (state.page - 1) * state.pageSize;
      list.slice(start, start + state.pageSize).forEach(function (c) { state.selected[c.id] = on; });
      render();
    });

    document.getElementById("tbody").addEventListener("click", function (e) {
      var sw = e.target.closest("[data-switch]");
      if (sw) { openStatusConfirm([findCustomer(sw.getAttribute("data-switch"))], !findCustomer(sw.getAttribute("data-switch")).enabled); return; }
      var btn = e.target.closest("button[data-act]");
      if (!btn) return;
      if (btn.classList.contains("disabled")) { toast("仅「启用 + 认证通过」的客户可撮合开户"); return; }
      var c = findCustomer(btn.getAttribute("data-id"));
      var act = btn.getAttribute("data-act");
      if (act === "detail") openDetail(c);
      if (act === "edit") openForm(c, "edit");
      if (act === "copy") openForm(c, "copy");
      if (act === "account") openAccount(c);
    });

    document.getElementById("pagination").addEventListener("click", function (e) {
      var p = e.target.closest("button[data-page]");
      if (p) { state.page = Number(p.getAttribute("data-page")); render(); return; }
      if (e.target.id === "prevPage") { state.page = Math.max(1, state.page - 1); render(); return; }
      if (e.target.id === "nextPage") { state.page = state.page + 1; render(); return; }
    });
    document.getElementById("pagination").addEventListener("change", function (e) {
      if (e.target.id === "pageSize") { state.pageSize = Number(e.target.value); state.page = 1; render(); }
      if (e.target.id === "gotoPage") {
        var v = Number(e.target.value) || 1;
        var maxPage = Math.max(1, Math.ceil(getFiltered().length / state.pageSize));
        state.page = Math.min(maxPage, Math.max(1, v));
        render();
      }
    });

    document.getElementById("addBtn").addEventListener("click", function () { openForm(null, "add"); });
  }

  function selectedCustomers() {
    return customers.filter(function (c) { return state.selected[c.id]; });
  }
  function findCustomer(id) {
    for (var i = 0; i < customers.length; i++) if (customers[i].id === id) return customers[i];
    return null;
  }

  /* ============ 抽屉壳 ============ */
  function openDrawer(side, title, subtitle, bodyHtml, footerHtml, afterMount) {
    var layer = document.getElementById("drawerLayer");
    layer.innerHTML =
      '<div class="overlay" id="drawerOverlay">' +
        '<section class="drawer drawer-' + side + '">' +
          "<header><div class=\"head-left\">" +
            '<svg class="icon"><use href="#i-users"/></svg><b>' + title + "</b>" +
            (subtitle ? "<small>" + subtitle + "</small>" : "") +
          "</div><button class=\"close\" data-close-drawer aria-label=\"关闭\">×</button></header>" +
          '<div class="drawer-body">' + bodyHtml + "</div>" +
          "<footer>" + footerHtml + "</footer>" +
        "</section>" +
      "</div>";
    layer.querySelector("[data-close-drawer]").addEventListener("click", closeDrawer);
    layer.querySelector("#drawerOverlay").addEventListener("mousedown", function (e) {
      if (e.target === this) closeDrawer();
    });
    if (afterMount) afterMount(layer);
  }
  function closeDrawer() {
    document.getElementById("drawerLayer").innerHTML = "";
  }

  function openModal(html, afterMount) {
    var layer = document.getElementById("modalLayer");
    layer.innerHTML = '<div class="modal-overlay" id="modalOverlay">' + html + "</div>";
    var ov = layer.querySelector("#modalOverlay");
    ov.addEventListener("mousedown", function (e) { if (e.target === this) closeModal(); });
    var closeBtn = layer.querySelector("[data-close-modal]");
    if (closeBtn) closeBtn.addEventListener("click", closeModal);
    if (afterMount) afterMount(layer);
  }
  function closeModal() { document.getElementById("modalLayer").innerHTML = ""; }

  function toast(msg) {
    var wrap = document.getElementById("toastWrap");
    var el = document.createElement("div");
    el.className = "toast";
    el.innerHTML = '<svg class="icon"><use href="#i-check"/></svg><span>' + msg + "</span>";
    wrap.appendChild(el);
    setTimeout(function () { el.remove(); }, 2400);
  }

  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    if (document.getElementById("modalLayer").innerHTML) { closeModal(); return; }
    if (document.getElementById("drawerLayer").innerHTML) closeDrawer();
  });

  /* ============ 详情抽屉 ============ */
  var DETAIL_TABS = [
    { key: "base", label: "基本信息", icon: "i-users" },
    { key: "cert", label: "认证信息", icon: "i-cert" },
    { key: "contract", label: "合同信息", icon: "i-contract" },
    { key: "bank", label: "银行卡", icon: "i-bank" },
    { key: "account", label: "撮合账户", icon: "i-card" },
    { key: "log", label: "操作日志", icon: "i-log" }
  ];

  function openDetail(c) {
    var body =
      '<div class="drawer-layout detail-layout">' +
        '<aside class="drawer-tabs" id="detailTabs">' +
          DETAIL_TABS.map(function (t, i) {
            return '<button data-tab="' + t.key + '"' + (i === 0 ? ' class="active"' : "") + '><svg class="icon"><use href="#' + t.icon + '"/></svg>' + t.label + "</button>";
          }).join("") +
        "</aside>" +
        '<div class="detail-scroll" id="detailScroll">' + detailTabHtml(c, "base") + "</div>" +
      "</div>";
    openDrawer("left", "物流客户详情", c.id, body,
      '<button class="btn" data-close-drawer2>关闭</button>',
      function (layer) {
        layer.querySelector("[data-close-drawer2]").addEventListener("click", closeDrawer);
        layer.querySelector("#detailTabs").addEventListener("click", function (e) {
          var b = e.target.closest("button[data-tab]");
          if (!b) return;
          layer.querySelectorAll("#detailTabs button").forEach(function (x) { x.classList.remove("active"); });
          b.classList.add("active");
          var scroll = layer.querySelector("#detailScroll");
          scroll.innerHTML = detailTabHtml(c, b.getAttribute("data-tab"));
          scroll.scrollTop = 0;
          bindDetailInner(scroll, c);
        });
        bindDetailInner(layer.querySelector("#detailScroll"), c);
      });
  }

  function bindFeeEditor(root, c, rerender) {
    var editBtn = root.querySelector("[data-fee-edit]");
    var panel = root.querySelector("[data-fee-panel]");
    if (!editBtn || !panel) return;
    editBtn.addEventListener("click", function () {
      var hidden = panel.classList.toggle("hidden");
      editBtn.textContent = hidden ? "编辑配置" : "收起配置";
    });
    panel.querySelectorAll("[data-fee-cycle] button").forEach(function (x) {
      x.addEventListener("click", function () {
        panel.querySelectorAll("[data-fee-cycle] button").forEach(function (y) { y.classList.remove("active"); });
        x.classList.add("active");
      });
    });
    var cancelBtn = panel.querySelector("[data-fee-cancel]");
    if (cancelBtn) cancelBtn.addEventListener("click", function () {
      panel.classList.add("hidden");
      editBtn.textContent = "编辑配置";
    });
    var saveBtn = panel.querySelector("[data-fee-save]");
    if (saveBtn) saveBtn.addEventListener("click", function () {
      var cycleBtn = panel.querySelector("[data-fee-cycle] button.active");
      if (cycleBtn) c.settleCycle = cycleBtn.textContent.trim();
      panel.classList.add("hidden");
      editBtn.textContent = "编辑配置";
      toast("结算配置已保存");
      if (rerender) rerender();
    });
  }
  window.__custBindFeeEditor = bindFeeEditor;

  // 撮合账户「更新余额」：模拟向三方拉取最新余额
  document.addEventListener("click", function (e) {
    var btn = e.target.closest && e.target.closest("[data-refresh-balance]");
    if (!btn || btn.disabled) return;
    btn.disabled = true;
    var label = btn.innerHTML;
    btn.innerHTML = "更新中…";
    setTimeout(function () {
      btn.disabled = false;
      btn.innerHTML = label;
      var scope = btn.closest(".matching-account-row") || document;
      var stamp = scope.querySelector("[data-bal-time]");
      if (stamp) {
        var d = new Date();
        var p2 = function (n) { return (n < 10 ? "0" : "") + n; };
        stamp.textContent = "三方虚拟账户实时余额 · 更新于 " + d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate()) + " " + p2(d.getHours()) + ":" + p2(d.getMinutes());
      }
      toast("账户余额已更新");
    }, 800);
  });

  function bindDetailInner(root, c) {
    var btn = root.querySelector("[data-open-account]");
    if (btn) btn.addEventListener("click", function () { closeDrawer(); openAccount(c); });
    var retry = root.querySelector("[data-retry-account]");
    if (retry) retry.addEventListener("click", function () { closeDrawer(); openAccount(c); });
    bindFeeEditor(root, c, function () {
      root.innerHTML = detailTabHtml(c, "account");
      bindDetailInner(root, c);
    });
  }

  function bindFormInner(root) {
    root.querySelectorAll(".agent-switch").forEach(function (sw) {
      sw.addEventListener("click", function () {
        sw.classList.toggle("on");
        sw.setAttribute("aria-checked", sw.classList.contains("on"));
        var dep = root.querySelector("[data-warn-dep]");
        if (dep) dep.classList.toggle("hidden", !sw.classList.contains("on"));
      });
    });
    root.querySelectorAll(".segmented").forEach(function (seg) {
      seg.addEventListener("click", function (e) {
        var b = e.target.closest("button");
        if (!b) return;
        seg.querySelectorAll("button").forEach(function (x) { x.classList.remove("active"); });
        b.classList.add("active");
      });
    });
    var boSeg = root.querySelector('.segmented[data-seg="boLong"]');
    if (boSeg) boSeg.addEventListener("click", function () {
      var end = root.querySelector("#f-bo-end");
      if (!end) return;
      var act = boSeg.querySelector("button.active");
      var isLong = act && act.getAttribute("data-v") === "长期有效";
      end.disabled = isLong;
      end.placeholder = isLong ? "长期有效无需填写" : "请选择证件截止日期";
    });
    var grpBanner = root.querySelector("[data-cert-banner] input[type=checkbox]");
    if (grpBanner) grpBanner.addEventListener("change", function () {
      root.querySelectorAll("[data-group-req]").forEach(function (st) { st.hidden = !grpBanner.checked; });
    });
    root.querySelectorAll(".cert-drop, .cert-file-row").forEach(function (d) {
      d.addEventListener("click", function () {
        toast("原型演示：选择「" + (d.getAttribute("data-upload") || "文件") + "」上传");
      });
    });
    root.querySelectorAll(".status-choice").forEach(function (grp) {
      grp.addEventListener("click", function (e) {
        var b = e.target.closest("button");
        if (!b) return;
        grp.querySelectorAll("button").forEach(function (x) { x.classList.remove("active", "off"); });
        b.classList.add("active");
        if (b.getAttribute("data-v") === "off") b.classList.add("off");
      });
    });
    root.querySelectorAll(".attachment-uploader, .uploader").forEach(function (up) {
      up.addEventListener("click", function (e) {
        if (e.target.closest("[data-remove]")) {
          up.classList.remove("has-file");
          var t = up.querySelector("b");
          if (t) t.textContent = up.getAttribute("data-empty") || "点击选择或拖拽文件到此处";
          var s = up.querySelector("small");
          if (s) s.textContent = up.getAttribute("data-help") || "";
          var em = up.querySelector("em, .up-action");
          if (em) em.textContent = "选择文件";
          up.removeAttribute("data-file");
          return;
        }
        var name = "开户许可证.pdf";
        if (up.getAttribute("data-kind") === "contract") name = "业务合作协议.pdf";
        if (up.getAttribute("data-kind") === "license") name = "营业执照.pdf";
        if (up.getAttribute("data-kind") === "transport") name = "道路运输许可证.pdf";
        if (up.getAttribute("data-kind") === "invoice") name = "开票资料.pdf";
        up.classList.add("has-file");
        up.setAttribute("data-file", name);
        var b = up.querySelector("b");
        if (b) b.textContent = name;
        var s = up.querySelector("small");
        if (s) s.textContent = "已选择文件，提交时一并上传";
        var em = up.querySelector("em, .up-action");
        if (em) em.textContent = "重新选择";
        if (up.hasAttribute("data-gate")) refreshAccountGate();
      });
    });

  function updateCount(cfg, listLen) {

  function find(cfg, id) {

  function render(cfg) {
    var host = document.getElementById("page-" + cfg.key);
    var body = host && host.querySelector("[data-body]");
    if (!body) return;
    var list = filtered(cfg), st = cfg.state;
    var maxPage = Math.max(1, Math.ceil(list.length / st.pageSize));
    if (st.page > maxPage) st.page = maxPage;
    var rows = list.slice((st.page - 1) * st.pageSize, st.page * st.pageSize);
    body.innerHTML = rows.length
      ? rows.map(function (it) {
          var html = cfg.row(it);
          if (cfg.selectable) {
            var cb = '<td class="check-cell"><input type="checkbox" data-check="' + it.id + '"' + (st.selection[it.id] ? " checked" : "") + ' aria-label="选择" /></td>';
            var m = html.match(/^<tr[^>]*>/);
            html = m ? html.replace(m[0], m[0] + cb) : cb + html;

    var pag = host.querySelector("[data-pag]");

      "<button data-prev" + (st.page === 1 ? " disabled" : "") + ">上一页</button>" +
      '<div class="page-nums">' + nums + "</div>" +

      '<span>前往</span><input data-goto value="' + st.page + '" /><span>页</span>';

      else if (b.hasAttribute("data-next")) st.page = st.page + 1;

      else return;
      render(cfg);
