<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>撮合交易订单管理</title>
<style>
:root{
  --ground:#eef1f7; --surface:#ffffff; --surface-2:#f7f9fc; --surface-3:#eff3fa;
  --ink:#1b2330; --ink-2:#48536a; --muted:#79839a; --line:#e2e7f1; --line-2:#eceff6;
  --brand:#1e3fa8; --brand-2:#2f54c7; --brand-soft:#e9edfd; --brand-ink:#2544a8;
  --oil:#2f6fed; --oil-soft:#e8f0ff;
  --fee:#a86a08; --fee-soft:#fdf1dd;
  --ok:#0f7f5b; --ok-soft:#e2f5ee;
  --warn:#a96c05; --warn-soft:#fbf0d9;
  --bad:#c23b2c; --bad-soft:#fdeae7;
  --info:#2f6fed; --info-soft:#e9f1ff;
  --note-bg:#f4f6fb; --note-line:#c9d3e6;
  --shadow:0 1px 2px rgba(27,35,48,.05),0 8px 24px -12px rgba(27,35,48,.18);
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#10141c; --surface:#171d27; --surface-2:#1c2430; --surface-3:#212a38;
    --ink:#e8edf6; --ink-2:#b3bdd0; --muted:#8590a6; --line:#2a3444; --line-2:#232c3a;
    --brand:#7f9bff; --brand-2:#93aaff; --brand-soft:#1e2a4a; --brand-ink:#a9bcff;
    --oil:#7aa5ff; --oil-soft:#1c2a45;
    --fee:#e0a94f; --fee-soft:#33280f;
    --ok:#4dc79b; --ok-soft:#122f26;
    --warn:#dfa848; --warn-soft:#32270f;
    --bad:#f0796a; --bad-soft:#38201d;
    --info:#7aa5ff; --info-soft:#1a2740;
    --note-bg:#141a24; --note-line:#334056;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --ground:#10141c; --surface:#171d27; --surface-2:#1c2430; --surface-3:#212a38;
  --ink:#e8edf6; --ink-2:#b3bdd0; --muted:#8590a6; --line:#2a3444; --line-2:#232c3a;
  --brand:#7f9bff; --brand-2:#93aaff; --brand-soft:#1e2a4a; --brand-ink:#a9bcff;
  --oil:#7aa5ff; --oil-soft:#1c2a45;
  --fee:#e0a94f; --fee-soft:#33280f;
  --ok:#4dc79b; --ok-soft:#122f26;
  --warn:#dfa848; --warn-soft:#32270f;
  --bad:#f0796a; --bad-soft:#38201d;
  --info:#7aa5ff; --info-soft:#1a2740;
  --note-bg:#141a24; --note-line:#334056;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
}
:root{color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark}}
:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:Inter,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  font-size:13px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
.mono,.num{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand-2);outline-offset:2px;border-radius:4px}

/* shell */
.app{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:100vh}
.rail{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 16px}
.brand .mark{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--brand),var(--oil));display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px}
.brand b{font-size:15px;letter-spacing:.02em}
.brand small{display:block;color:var(--muted);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase}
.nav{padding:4px 10px 24px;display:flex;flex-direction:column;gap:2px}
.nav .grp{padding:14px 8px 6px;color:var(--muted);font-size:10.5px;letter-spacing:.16em}
.nav a{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--ink-2);font-size:12.5px}
.nav a:hover{background:var(--surface-3);color:var(--ink)}
.nav a.on{background:var(--brand);color:#fff;font-weight:600;box-shadow:0 6px 14px -8px var(--brand)}
.nav a .dot{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.45;flex:none}
.nav a.on .dot{opacity:1}
.nav a.dis{opacity:.42;cursor:not-allowed}

.main{min-width:0;display:flex;flex-direction:column}
.head{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.head .row1{display:flex;align-items:center;gap:12px;padding:14px 24px 10px}
.head h1{margin:0;font-size:17px;font-weight:600;letter-spacing:.01em}
.head .sub{color:var(--muted);font-size:12px}
.head .spacer{flex:1}
.mode{display:inline-flex;align-items:center;gap:6px;background:var(--fee-soft);color:var(--fee);border:1px solid color-mix(in srgb,var(--fee) 25%,transparent);padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600}
.tabstrip{display:flex;gap:2px;padding:0 24px;overflow-x:auto}
.tabstrip button{background:none;border:0;padding:9px 12px;font-size:12.5px;color:var(--ink-2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabstrip button:hover{color:var(--ink)}
.tabstrip button.on{color:var(--brand-ink);border-bottom-color:var(--brand);font-weight:600}
.body{padding:18px 24px 48px;display:flex;flex-direction:column;gap:14px}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.card-h h2{margin:0;font-size:13.5px;font-weight:600}
.card-h .spacer{flex:1}
.card-b{padding:16px}

/* filters */
.filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 18px;padding:16px 16px 6px}
.f{display:flex;align-items:center;gap:10px;min-width:0}
.f>label{width:78px;flex:none;text-align:right;color:var(--ink-2);font-size:12px}
.f>label.w2{width:88px}
.ctrl{flex:1;min-width:0;height:30px;border:1px solid var(--line);background:var(--surface-2);border-radius:7px;padding:0 10px;font-size:12px;color:var(--ink);display:flex;align-items:center;gap:6px;cursor:default}
.ctrl.ph{color:var(--muted)}
.ctrl .caret{margin-left:auto;color:var(--muted);font-size:10px}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;height:30px;flex:1}
.seg span{flex:1;display:grid;place-items:center;font-size:12px;color:var(--ink-2);background:var(--surface-2);cursor:pointer;user-select:none}
.seg span.on{background:var(--brand);color:#fff;font-weight:600}

/* 真实表单控件 */
.fc{flex:1;min-width:0;display:flex;align-items:center;gap:6px}
.inp{width:100%;min-width:0;height:30px;border:1px solid var(--line);background:var(--surface-2);border-radius:7px;padding:0 10px;font-size:12px;color:var(--ink);font-family:inherit}
.inp::placeholder{color:var(--muted)}
.inp:hover{border-color:color-mix(in srgb,var(--brand) 40%,var(--line))}
.inp:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 14%,transparent)}
.inp[readonly]{background:var(--surface-3);color:var(--ink-2);cursor:not-allowed}
.inp.calc{background:var(--brand-soft);border-color:color-mix(in srgb,var(--brand) 25%,transparent);font-weight:600;font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.inp.mono,.inp[type="number"]{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.inp[type="number"]{text-align:right}
select.inp{appearance:none;-webkit-appearance:none;cursor:pointer;padding-right:24px;height:30px;line-height:normal;overflow:hidden;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 13px) 13px,calc(100% - 9px) 13px;background-size:4px 4px,4px 4px;background-repeat:no-repeat;color:var(--ink)}
select.inp:invalid,select.inp.is-empty{color:var(--muted)}
textarea.inp{height:64px;padding:7px 10px;resize:vertical;line-height:1.5}
.inp:user-invalid,.inp.bad{border-color:var(--bad);background:var(--bad-soft)}
.num.over{color:var(--bad)}
.dash{color:var(--muted);flex:none;font-size:11px}
.unit{color:var(--muted);flex:none;font-size:11.5px}
.err{color:var(--bad);font-size:11px;display:none}
.err.on{display:block}
.counter{font-size:10.5px;color:var(--muted);text-align:right}
.filter-actions{display:flex;justify-content:flex-end;gap:8px;padding:6px 16px 16px}

.btn{height:30px;padding:0 14px;border-radius:7px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;font-size:12px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--brand);color:var(--brand-ink)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.btn.primary:hover{background:var(--brand-2);color:#fff}
.btn.sm{height:26px;padding:0 10px;font-size:11.5px}

/* quick filter chips */
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line-2)}
.chips button{height:27px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);font-size:12px;cursor:pointer;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.chips button.on{background:var(--brand-soft);border-color:color-mix(in srgb,var(--brand) 40%,transparent);color:var(--brand-ink);font-weight:600}
.chips button b{font-variant-numeric:tabular-nums}
.chips button.alert.on{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 40%,transparent);color:var(--bad)}

/* kpi */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:13px 15px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi .lab{color:var(--muted);font-size:11.5px}
.kpi .val{font-size:21px;font-weight:600;margin-top:4px;letter-spacing:-.01em}
.kpi .sub{font-size:11px;color:var(--muted);margin-top:2px}
.kpi .stripe{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brand)}
.kpi.fee .stripe{background:var(--fee)} .kpi.fee .val{color:var(--fee)}
.kpi.oil .stripe{background:var(--oil)} .kpi.oil .val{color:var(--oil)}
.kpi.warn .stripe{background:var(--warn)} .kpi.warn .val{color:var(--warn)}
.kpi.bad .stripe{background:var(--bad)} .kpi.bad .val{color:var(--bad)}

/* table */
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
thead th{position:sticky;top:0;background:var(--surface-3);text-align:left;font-size:11.5px;font-weight:600;color:var(--ink-2);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody td{padding:11px 12px;border-bottom:1px solid var(--line-2);vertical-align:top;font-size:12px}
tbody tr:hover{background:var(--surface-2)}
tbody tr.sub-row{background:var(--surface-2)}
tbody tr.sub-row td{padding-top:8px;padding-bottom:8px;font-size:11.5px;color:var(--ink-2)}
td .t1{font-weight:600;letter-spacing:-.01em}
td .t2{color:var(--muted);font-size:11px;margin-top:2px;overflow-wrap:anywhere}
td .t1.mono,td .t2.mono,td.mono{white-space:nowrap}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.acts button{background:none;border:0;padding:0;color:var(--brand-ink);cursor:pointer;font-size:12px}
.acts button:hover{text-decoration:underline}
.acts button.danger{color:var(--bad)}
.acts button.off{color:var(--muted);cursor:not-allowed;text-decoration:none}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 24%,transparent)}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 24%,transparent)}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 26%,transparent)}
.pill.info{background:var(--info-soft);color:var(--info);border-color:color-mix(in srgb,var(--info) 24%,transparent)}
.pill.mut{background:var(--surface-3);color:var(--muted);border-color:var(--line)}
.tag{display:inline-flex;align-items:center;padding:1px 6px;border-radius:5px;font-size:10.5px;border:1px solid var(--line);color:var(--ink-2);background:var(--surface-2);white-space:nowrap}
.tag.b{border-color:color-mix(in srgb,var(--brand) 35%,transparent);color:var(--brand-ink);background:var(--brand-soft)}
.tag.f{border-color:color-mix(in srgb,var(--fee) 35%,transparent);color:var(--fee);background:var(--fee-soft)}
.tag.o{border-color:color-mix(in srgb,var(--oil) 35%,transparent);color:var(--oil);background:var(--oil-soft)}
.trk{display:flex;flex-direction:column;gap:4px}
.trk .mini{font-size:10.5px;color:var(--muted);display:flex;gap:5px;align-items:center;white-space:nowrap}
.trk .mini i{font-style:normal;width:14px;height:14px;border-radius:4px;display:grid;place-items:center;font-size:9px;font-weight:700;background:var(--surface-3);color:var(--ink-2)}
.trk .mini i.a{background:var(--oil-soft);color:var(--oil)}
.trk .mini i.b{background:var(--fee-soft);color:var(--fee)}

/* pagination */
.pager{display:flex;align-items:center;gap:10px;justify-content:flex-end;padding:12px 16px;color:var(--muted);font-size:12px}
.pager .pg{display:flex;gap:4px}
.pager .pg span{min-width:26px;height:26px;display:grid;place-items:center;border:1px solid var(--line);border-radius:6px;cursor:pointer;color:var(--ink-2);background:var(--surface-2)}
.pager .pg span.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}

/* bottom notes panel — 说明性内容，与原型分离 */
.notes{margin-top:16px;border:1px dashed var(--note-line);border-radius:var(--radius);background:var(--note-bg)}
.notes>summary{cursor:pointer;list-style:none;padding:12px 16px;font-size:12.5px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:8px}
.notes>summary::-webkit-details-marker{display:none}
.notes>summary::before{content:"▸";color:var(--muted);transition:transform .15s}
.notes[open]>summary::before{transform:rotate(90deg)}
.notes>summary .hint{font-weight:400;color:var(--muted);font-size:11.5px;margin-left:auto}
.notes-b{padding:0 16px 16px;display:flex;flex-direction:column;gap:14px;font-size:12px;color:var(--ink-2)}
.notes-b h4{margin:0 0 6px;font-size:12.5px;color:var(--ink);font-weight:600}
.notes-b p{margin:0}
.notes-b ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.notes-b ol{margin:0}
.cprog{display:flex;align-items:center;gap:3px}
.cprog .cs{width:14px;height:4px;border-radius:2px;background:var(--line);flex:none}
.cprog .cs.done{background:var(--brand)}
.cprog .cl{margin-left:6px;font-size:11.5px;color:var(--muted);white-space:nowrap}
.mode.cust{background:var(--brand-soft);color:var(--brand-ink);border-color:color-mix(in srgb,var(--brand) 32%,transparent)}
.notes-b code{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11px;background:var(--surface-3);border:1px solid var(--line);border-radius:4px;padding:1px 4px;color:var(--brand-ink);white-space:nowrap}
.notes-b pre.code{white-space:pre;line-height:1.6}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(15,20,30,.42);opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(920px,88vw);background:var(--ground);border-left:1px solid var(--line);z-index:61;transform:translateX(100%);transition:transform .26s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;box-shadow:-24px 0 60px -30px rgba(0,0,0,.5)}
.drawer.on{transform:none}
@media (prefers-reduced-motion:reduce){.drawer,.scrim{transition:none}}
.drawer-h{display:flex;align-items:center;gap:10px;padding:14px 18px;background:var(--surface);border-bottom:1px solid var(--line)}
.drawer-h h2{margin:0;font-size:15px;font-weight:600}
.drawer-h .spacer{flex:1}
.x{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;display:grid;place-items:center;color:var(--muted)}
.drawer-body{flex:1;overflow:auto;display:grid;grid-template-columns:150px minmax(0,1fr)}
.drawer-body.nonav{grid-template-columns:minmax(0,1fr)}
.drawer-nav{border-right:1px solid var(--line);background:var(--surface);padding:14px 10px;display:flex;flex-direction:column;gap:2px}
.drawer-nav:empty{display:none}
.drawer-nav button{text-align:left;background:none;border:0;padding:8px 10px;border-radius:7px;cursor:pointer;font-size:12.5px;color:var(--ink-2)}
.drawer-nav button:hover{background:var(--surface-3)}
.drawer-nav button.on{background:var(--brand-soft);color:var(--brand-ink);font-weight:600}
.drawer-main{padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}

.sumhead{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.sumhead .no{font-size:16px;font-weight:600;letter-spacing:-.01em}
.sumhead .sec{color:var(--muted);font-size:11.5px;margin-top:2px}
.sumhead .pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.sumhead .money{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.sumhead .money div .l{color:var(--muted);font-size:11px}
.sumhead .money div .v{font-size:19px;font-weight:600;margin-top:2px}
.sumhead .money div.oilv .v{color:var(--oil)}
.sumhead .money div.feev .v{color:var(--fee)}

.sec-title{font-size:13px;font-weight:600;padding-bottom:8px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:8px}
.kv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:9px 14px;font-size:12.5px;margin:10px 0 0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;color:var(--ink);overflow-wrap:anywhere}
.kv dd .m2{color:var(--muted);font-size:11.5px;margin-top:2px}

.flow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:11.5px}
.flow .n{background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:6px 10px}
.flow .n.oil{background:var(--oil-soft);border-color:color-mix(in srgb,var(--oil) 30%,transparent);color:var(--oil);font-weight:600}
.flow .n.fee{background:var(--fee-soft);border-color:color-mix(in srgb,var(--fee) 30%,transparent);color:var(--fee);font-weight:600}
.flow .ar{color:var(--muted)}
.tl{display:flex;flex-direction:column;margin-top:4px}
.tl .it{display:grid;grid-template-columns:16px minmax(0,1fr);gap:12px;padding-bottom:14px;position:relative}
.tl .it::before{content:"";position:absolute;left:7px;top:16px;bottom:0;width:1px;background:var(--line)}
.tl .it:last-child::before{display:none}
.tl .dot{width:15px;height:15px;border-radius:50%;border:2px solid var(--ok);background:var(--surface);margin-top:1px}
.tl .dot.pend{border-color:var(--line)}
.tl .dot.run{border-color:var(--warn)}
.tl .dot.fail{border-color:var(--bad)}
.tl .h{font-size:12.5px;font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tl .m{color:var(--muted);font-size:11.5px;margin-top:2px}
.tl .track{font-size:10.5px;font-weight:400;color:var(--muted)}

.banner{display:flex;gap:10px;align-items:flex-start;border-radius:9px;padding:11px 13px;font-size:12px;border:1px solid}
.banner.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 28%,transparent);color:var(--bad)}
.banner.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 28%,transparent);color:var(--warn)}
.banner b{display:block;margin-bottom:2px}
.banner .txt b{display:inline;margin:0}
.banner .txt{color:var(--ink-2)}

/* 金额大写 */
function rmbUpper(n){
  const d='零壹贰叁肆伍陆柒捌玖', u=['','拾','佰','仟'], g=['','万','亿'];
  let [i,f] = n.toFixed(2).split('.');
  let s='', gi=0;
  while(i.length){
    const part = i.slice(-4); i = i.slice(0,-4);
    let ps='', zero=false;
    for(let k=0;k<part.length;k++){
      const dg=+part[part.length-1-k];
      if(dg===0){ zero=true; } else { if(zero&&ps)ps='零'+ps; zero=false; ps=d[dg]+u[k]+ps; }
    }
    if(ps) s = ps + g[gi] + s;
    gi++;
  }
  s = (s||'零') + '元';
  const jiao=+f[0], fen=+f[1];
  if(!jiao && !fen) return s+'整';
  s += jiao ? d[jiao]+'角' : (fen?'零':'');
  if(fen) s += d[fen]+'分';
  return s;
}

/* ================= 控件工厂 =================
   t: text 文本 | code 编号（大写字母数字） | tel 手机号 | plate 车牌
      num 数字 | amt 金额 | sel 下拉 | date 日期 | dt 日期时间
      range 日期区间 | numrange 数字区间 | seg 分段 | ta 多行文本 | file 文件 */
function ctlHTML(o){
  const id = o.id ? ` id="${o.id}"` : '';
  const ro = o.ro ? ' readonly tabindex="-1"' : '';
  const cls = 'inp' + (o.calc?' calc':'') + (o.mono?' mono':'');
  const ph = o.p ? ` placeholder="${o.p}"` : '';
  const val = o.v!==undefined ? ` value="${o.v}"` : '';
  switch(o.t){
    case 'sel':
      return `<select size="1" class="${cls} is-empty"${id}${o.req?' required':''} data-sel>
        <option value="">${o.p||'请选择'}</option>
        ${(o.o||[]).map(v=>`<option${o.v===v?' selected':''}>${v}</option>`).join('')}</select>`;
    case 'num': case 'amt': {
      const step = o.step!==undefined?o.step:(o.t==='amt'?'0.01':'1');
      const min = o.min!==undefined?o.min:0;
      const max = o.max!==undefined?o.max:(o.t==='amt'?99999999.99:999999);
      return `<input class="${cls}" type="number" inputmode="decimal"${id}${ph}${val}${ro}
        min="${min}" max="${max}" step="${step}"${o.req?' required':''} data-dec="${String(step).split('.')[1]?String(step).split('.')[1].length:0}">`;
    }
    case 'tel':
      return `<input class="${cls} mono" type="tel" inputmode="numeric"${id}${ph}${val}${ro}
        maxlength="11" pattern="1[3-9][0-9]{9}"${o.req?' required':''} data-digits>`;
    case 'plate':
      return `<input class="${cls}" type="text"${id}${ph}${val}${ro} maxlength="8"${o.req?' required':''} data-upper>`;
    case 'code':
      return `<input class="${cls} mono" type="text"${id}${ph}${val}${ro}
        maxlength="${o.max||32}" pattern="[A-Za-z0-9_-]{0,${o.max||32}}"${o.req?' required':''} data-upper data-code>`;
    case 'taxno':
      return `<input class="${cls} mono" type="text"${id}${ph}${val}${ro} maxlength="20" pattern="[0-9A-Z]{15,20}"${o.req?' required':''} data-upper data-code>`;
    case 'date':
      return `<input class="${cls}" type="date"${id}${val}${ro}${o.req?' required':''}>`;
    case 'dt':
      return `<input class="${cls}" type="datetime-local"${id}${val}${ro}${o.req?' required':''}>`;
    case 'range':
      return `<input class="inp" type="date" value="${o.v1||''}"><span class="dash">～</span><input class="inp" type="date" value="${o.v2||''}">`;
    case 'dtrange':
      return `<input class="inp" type="datetime-local" value="${o.v1||''}"><span class="dash">～</span><input class="inp" type="datetime-local" value="${o.v2||''}">`;
    case 'numrange':
      return `<input class="inp" type="number" inputmode="decimal" min="0" step="${o.step||'0.01'}" placeholder="${o.p1||'最小'}"><span class="dash">～</span><input class="inp" type="number" inputmode="decimal" min="0" step="${o.step||'0.01'}" placeholder="${o.p2||'最大'}">${o.unit?`<span class="unit">${o.unit}</span>`:''}`;
    case 'seg':
      return `<div class="seg" data-seg>${o.o.map((s,k)=>`<span class="${k===0?'on':''}">${s}</span>`).join('')}</div>`;
    case 'ta':
      return `<textarea class="${cls}"${id}${ph}${ro} maxlength="${o.max||200}"${o.req?' required':''} data-count>${o.v||''}</textarea>`;
    case 'file':
      return `<div class="up" tabindex="0">${o.p}</div>`;
    default:
      return `<input class="${cls}" type="text"${id}${ph}${val}${ro} maxlength="${o.max||50}"${o.req?' required':''}>`;
  }
}

  if(el.hasAttribute('data-code'))   el.value = el.value.replace(/[^A-Za-z0-9_-]/g,'');
  if(el.hasAttribute('data-upper'))  el.value = el.value.toUpperCase();
  if(el.hasAttribute('data-count')){
    const c = el.closest('.fi')?.querySelector('.counter b');
    if(c) c.textContent = el.value.length;
  }
  if(el.tagName==='SELECT') el.classList.toggle('is-empty', !el.value);
}, true);

  if(el.tagName==='SELECT' && el.classList.contains('inp')) el.classList.toggle('is-empty', !el.value);
}, true);
/* 数字：失焦时按 step 规范小数位并夹到 min/max */
document.addEventListener('blur', e=>{
  const el = e.target;
  if(!el.classList || !el.classList.contains('inp') || el.type!=='number' || el.value==='') return;
  const dec = +(el.dataset.dec||0);
  let v = parseFloat(el.value);
  if(isNaN(v)){ el.value=''; return; }
  if(el.min!=='') v = Math.max(+el.min, v);
  if(el.max!=='') v = Math.min(+el.max, v);
  el.value = v.toFixed(dec);
  el.dispatchEvent(new Event('input',{bubbles:true}));
}, true);

  ${notes(

const BINDS = {
  backfill(){
    const $=id=>document.getElementById(id);
    const price=$('bf_price'), qty=$('bf_qty'), amt=$('bf_amt'), fee=$('bf_fee'), recv=$('bf_recv');
    if(!price) return;
    const calc=()=>{
      const a = (parseFloat(price.value)||0) * (parseFloat(qty.value)||0);
      const f = Math.round(a*FEE_RATE*100)/100;
      amt.value  = a.toFixed(2);
      fee.value  = f.toFixed(2);
      recv.value = (a-f).toFixed(2);
    };
    price.addEventListener('input',calc);
    qty.addEventListener('input',calc);
    calc();
  },
  invoice(){
    const $=id=>document.getElementById(id);
    const mode=$('iv_mode'), tb=$('iv_split'), chk=$('iv_check');
    if(!mode) return;
    const G = INVOICE_PICK.groups;
    const LIMIT = 1000000;
    const manual = {};                       // { g.k: [金额, ...] }

    const autoAmts = g => {
      let n = parseInt($('cnt_'+g.k).value)||1;
      n = Math.max(1, Math.min(20, n));
      if(mode.value==='不拆分') n = 1;
      const each = Math.floor(g.amt/n*100)/100;
      const out = []; let acc = 0;
      for(let i=1;i<=n;i++){
        const a = i===n ? +(g.amt-acc).toFixed(2) : each;
        acc = +(acc+a).toFixed(2); out.push(a);
      }
      return out;
    };
    const seedManual = () => { G.forEach(g=>{ manual[g.k] = autoAmts(g); }); };

    const render = () => {
      const isManual = mode.value==='手动拆分';
      const label = isManual ? '手动' : (mode.value==='按体积拆分' ? '按数量' : (mode.value==='不拆分' ? '不拆分' : '按金额'));
      const rows = []; let seq = 0; let allOk = true; const msgs = [];

      G.forEach(g=>{
        const cnt = $('cnt_'+g.k);
        const amts = isManual ? (manual[g.k]||[]) : autoAmts(g);
        // 张数输入：自动模式可改，手动模式只读并回显行数
        cnt.readOnly = isManual;
        cnt.value = amts.length;
        cnt.title = isManual ? '手动拆分时由下方行数决定' : '';

        let sum = 0;
        amts.forEach((a,idx)=>{
          seq++; sum = +(sum + a).toFixed(2);
          const q = g.amt ? +(g.qty*a/g.amt).toFixed(2) : 0;
          const oc = g.amt ? Math.max(1, Math.round(g.orders*a/g.amt)) : 0;
          const over = a > LIMIT;
          rows.push(
            '<tr>' +
            '<td class="num">'+seq+'</td>' +
            '<td><div class="t1">'+g.co+'</div><div class="t2 mono">'+g.taxNo+'</div></td>' +
            '<td>'+g.energy+' · '+g.rate+'</td>' +
            '<td><span class="tag">'+label+'</span></td>' +
            '<td>' + (isManual
                ? '<input class="inp'+(over?' bad':'')+'" type="number" data-manual="'+g.k+'" data-idx="'+idx+'" value="'+a.toFixed(2)+'" min="0.01" max="99999999.99" step="0.01" data-dec="2" style="width:130px">'
                : '<span class="num'+(over?' over':'')+'">'+money(a)+'</span>') + '</td>' +
            '<td class="num">'+q.toFixed(2)+' '+g.unit+'</td>' +
            '<td class="num">'+oc+'</td>' +
            '<td class="acts">' + (isManual
                ? '<button data-del="'+g.k+'" data-idx="'+idx+'" class="'+(amts.length<=1?'off':'danger')+'">删除</button>'
                : '—') + '</td>' +
            '</tr>'
          );
          if(over){ allOk=false; msgs.push(g.co+' 第 '+(idx+1)+' 张超过单张限额'); }
        });

        if(isManual){
          const diff = +(g.amt - sum).toFixed(2);
          const ok = Math.abs(diff) < 0.005;
          if(!ok){ allOk=false; msgs.push(g.co+' 差额 '+(diff>0?'+':'')+money(diff)+' 元'); }
          rows.push(
            '<tr class="sub-row">' +
            '<td></td><td colspan="3">' + g.co + ' 小计</td>' +
            '<td class="num" data-sum="'+g.k+'" style="font-weight:600;color:'+(ok?'var(--ok)':'var(--bad)')+'">'+money(sum)+' / '+money(g.amt)+'</td>' +
            '<td colspan="2" data-state="'+g.k+'">' + (ok ? '<span class="pill ok">已分配完</span>'
                                     : '<span class="pill bad">差额 '+(diff>0?'+':'')+money(diff)+'</span>') + '</td>' +
            '<td class="acts">' + (amts.length<20 ? '<button data-add="'+g.k+'">添加一张</button>' : '<button class="off">已达 20 张</button>') + '</td>' +
            '</tr>'
          );
        }
      });

      tb.innerHTML = rows.join('');

      const total = G.reduce((a,g)=>a+g.amt,0);
      const sumAll = G.reduce((a,g)=>a + (isManual ? (manual[g.k]||[]).reduce((x,y)=>x+y,0) : g.amt), 0);
      chk.innerHTML = allOk
        ? '<span style="color:var(--ok)">校验通过：各张金额之和 '+money(+sumAll.toFixed(2))+' = 合计金额 '+money(total)+'，误差 0；'+G.length+' 家油站公司各至少一张发票 ✓</span>'
        : '<span style="color:var(--bad)">校验不通过：'+[...new Set(msgs)].join('；')+'</span>';
      const btn=$('iv_submit');
      if(btn){ btn.textContent = '生成 '+G.length+' 个开票申请单'; btn.disabled = !allOk; btn.style.opacity = allOk?'':'0.5'; }
    };

    mode.addEventListener('change', ()=>{ if(mode.value==='手动拆分') seedManual(); render(); });
    G.forEach(g=>$('cnt_'+g.k).addEventListener('input', ()=>{ if(mode.value!=='手动拆分') render(); }));

    tb.addEventListener('input', e=>{
      const el = e.target.closest('[data-manual]'); if(!el) return;
      const k = el.dataset.manual, idx = +el.dataset.idx;
      manual[k][idx] = parseFloat(el.value)||0;
      // 只更新校验，不整表重绘，避免输入时失焦
      const g = G.find(x=>x.k===k);
      const sum = +manual[k].reduce((a,b)=>a+b,0).toFixed(2);
      const diff = +(g.amt - sum).toFixed(2);
      const ok = Math.abs(diff) < 0.005 && !manual[k].some(a=>a>LIMIT);
      const sumCell = tb.querySelector('[data-sum="'+k+'"]');
      const stCell  = tb.querySelector('[data-state="'+k+'"]');
      if(sumCell){
        sumCell.innerHTML = money(sum)+' / '+money(g.amt);
        sumCell.style.color = ok?'var(--ok)':'var(--bad)';
      }
      if(stCell){
        stCell.innerHTML = ok ? '<span class="pill ok">已分配完</span>'
          : '<span class="pill bad">差额 '+(diff>0?'+':'')+money(diff)+'</span>';
      }
      el.classList.toggle('bad', (parseFloat(el.value)||0) > LIMIT);
      const amtNow = parseFloat(el.value)||0;
      const tr = el.closest('tr');
      if(tr && g.amt){
        tr.children[5].textContent = (g.qty*amtNow/g.amt).toFixed(2) + ' ' + g.unit;
        tr.children[6].textContent = Math.max(1, Math.round(g.orders*amtNow/g.amt));
      }
      let allOk = true; const msgs = [];
      G.forEach(gg=>{
        const sm = +(manual[gg.k]||[]).reduce((a,b)=>a+b,0).toFixed(2);
        const df = +(gg.amt-sm).toFixed(2);
        if(Math.abs(df) >= 0.005){ allOk=false; msgs.push(gg.co+' 差额 '+(df>0?'+':'')+money(df)+' 元'); }
        if((manual[gg.k]||[]).some(a=>a>LIMIT)){ allOk=false; msgs.push(gg.co+' 存在超过单张限额的发票'); }
      });
      const total = G.reduce((a,g2)=>a+g2.amt,0);
      const sumAll = +G.reduce((a,g2)=>a+(manual[g2.k]||[]).reduce((x,y)=>x+y,0),0).toFixed(2);
      chk.innerHTML = allOk
        ? '<span style="color:var(--ok)">校验通过：各张金额之和 '+money(sumAll)+' = 合计金额 '+money(total)+'，误差 0；'+G.length+' 家油站公司各至少一张发票 ✓</span>'
        : '<span style="color:var(--bad)">校验不通过：'+[...new Set(msgs)].join('；')+'</span>';
      const btn=$('iv_submit');
      if(btn){ btn.disabled=!allOk; btn.style.opacity = allOk?'':'0.5'; }
    });

    tb.addEventListener('click', e=>{
      const add = e.target.closest('[data-add]');
      if(add){ const k=add.dataset.add; if(manual[k].length<20){ manual[k].push(0); render(); } return; }
      const del = e.target.closest('[data-del]');
      if(del && !del.classList.contains('off')){
        const k=del.dataset.del, idx=+del.dataset.idx;
        if(manual[k].length>1){ manual[k].splice(idx,1); render(); }
      }
    });

    render();
  }
};

      '<p><b>业务轨</b>：待接单 → 已接单 → 加油中 → 待核销 → 已核销。这条线只反映现场发生的事，一旦走到「已核销」就<b>永远不会回退</b>——油确实加过，这个事实不会因为后面退款或转账失败而改变。</p>' +
      '<p style="margin-top:8px"><b>资金轨</b>：分成三段来看。</p>' +
      flow([{t:'oil',x:'油款：客户 → 油站公司'},{t:'fee',x:'服务费：油站公司 → 平台'},{x:'易宝侧实际到账'}]) +
      '<p style="margin-top:8px">前两段是平台发出去的转账请求，第三段是钱在易宝那边真正划走的结果。<b>请求成功不等于到账</b>，所以第三段要单独看，以易宝的通知和主动查询为准。</p>' +
      '<p style="margin-top:6px">两笔转账有先后：油款成功了才发起服务费。油款没成，服务费不会发起。</p>') +
    nb('订单主状态是算出来的，不是填出来的',
      '<p>页面上那个「订单状态」，<b>没有任何人能直接改</b>，它是由两条轨道的状态组合推导出来的。这样做的好处是：状态永远和事实一致，不会出现「状态显示已完成但钱其实没到」这种情况。</p>' +
      '<table class="matrix"><thead><tr><th>业务轨走到哪</th><th>资金轨走到哪</th><th>订单显示什么</th><th>怎么理解</th></tr></thead><tbody>' +
      '<tr><td>已核销</td><td>两笔转账都成功</td><td>已完成</td><td>正常的终点</td></tr>' +
      '<tr><td>已核销</td><td>还在转账中</td><td>资金结算中</td><td>油加完了，钱在路上。业务侧照常展示，不用等钱</td></tr>' +
      '<tr><td>已核销</td><td>任一笔转账失败</td><td>异常（补偿中）</td><td>油加过的事实保留，钱的问题单独处理</td></tr>' +
      '<tr><td>已取消</td><td>还没开始转账</td><td>已取消</td><td>把冻结的额度解开就完事</td></tr>' +
      '<tr><td>已取消</td><td>钱已经转成功了</td><td>退款中 → 已退款</td><td>要把钱原路退回去，服务费也一起退</td></tr>' +
      '</tbody></table>') +
    nb('五种异常场景，系统各自怎么处理',
      tbl(['遇到什么情况','怎么判断','系统自动做什么','页面上能点什么'],[
        ['三方订单推送失败，但钱已经转了','三方回执超时，但资金侧有成功记录','<b>以钱为准</b>回写订单的资金状态，同时挂上对账差异标记','挂对账差异'],
        ['油加完了但转账失败','业务轨已核销，某一笔转账失败','业务轨保留不动；用原请求号自动重试 1/5/15/30/60 分钟，最多 5 次','立即重试 / 转人工补偿'],
        ['订单取消了但钱已经转成功','业务轨已取消，资金轨已支付','自动发起退回，油款和服务费一起退','无需人工，系统自动'],
        ['实际加油金额和预先算的对不上','核销金额 ≠ 预转账金额','实际多了就补一笔差额；实际少了就退一笔差额','无需人工，系统自动'],
        ['同一个通知收到好几次','同一个请求号重复通知','按请求号去重，只处理一次；同时主动去查一次真实状态做双重确认','—']
      ]) +
      '<p style="margin-top:8px">最后一条最关键：网络抖动、易宝重推都会造成重复通知。如果不去重，一笔转账会被记两次流水、额度被扣两回。去重的依据永远是<b>请求号</b>。</p>') +
    nb('顶部红色横幅什么时候出现',
      '<p>只要两笔转账里<b>有任何一笔是失败状态</b>，详情顶部就会出现红色横幅，里面写清楚：哪一笔失败了、失败原因、原请求号、已经重试到第几次、下一次什么时候重试。</p>' +
      '<p style="margin-top:6px">横幅下面配三个按钮：立即重试（不等自动重试的间隔，马上再试一次）、转人工补偿（放弃自动重试，生成工单交给运营处理）、挂对账差异（承认账面有差，交给财务在对账时处理）。</p>' +
      '<p style="margin-top:6px">横幅上永远会带一句「业务轨不回退」，这是给客服和运营看的——客户打电话问「我的订单是不是没加成油」时，答案是加成了，只是钱还没结清。</p>')
  )}`;
};

DTAB.voucher = o => {

  return `${sumHead(o)}` + (list.length
    ? list.map(v=>receiptHTML(v)).join('')

};

/* 电子回单 */
function receiptHTML(v){
  const ok = v.st!=='调拨失败';
  return `
  <div class="card"><div class="card-b" style="display:flex;flex-direction:column;gap:14px">
    <div class="receipt">
      <div class="rh">
        <div class="org">易 宝 支 付 YEEPAY</div>
        <div class="ti">电子回单</div>
        <div class="sn mono">回单编号 ${v.ser==='—'?'（受理失败，未生成回单）':v.ser}</div>
      </div>
      <div class="rb">
        <table>
          <tr><th>付款方</th><td>${v.from}<div class="t2">${acctTag(v.fromType)} 账户 ${v.fromAcct}</div></td>
              <th>收款方</th><td>${v.to}<div class="t2">${acctTag(v.toType)} 账户 ${v.toAcct}</div></td></tr>
          <tr><th>金额（小写）</th><td class="amt num">¥ ${money(v.amt)}</td>
              <th>交易时间</th><td class="mono">${v.t}</td></tr>
          <tr><th>金额（大写）</th><td colspan="3">人民币 ${rmbUpper(v.amt)}</td></tr>
          <tr><th>用途</th><td>${v.use}${v.rate!=='—'?'（费率 '+v.rate+'）':''}</td>
              <th>业务类型</th><td>${v.api}</td></tr>
          <tr><th>关联订单</th><td class="mono">${v.order}</td>
              <th>请求号</th><td class="mono">${v.req}</td></tr>
          <tr><th>受理结果</th><td colspan="3">${v.res} · 调拨状态 ${v.st}</td></tr>
        </table>
      </div>
      <div class="rf">
        <span>本回单由系统自动生成，作为撮合交易资金划转凭证，可用于对账与审计。</span>
        <span class="spacer"></span>
        ${ok?`<svg class="seal" viewBox="0 0 120 120" aria-label="交易成功印章">
          <circle cx="60" cy="60" r="52" fill="none" stroke="#c23b2c" stroke-width="3"/>
          <circle cx="60" cy="60" r="45" fill="none" stroke="#c23b2c" stroke-width="1"/>
          <path id="sealArc" d="M 25 60 A 35 35 0 0 1 95 60" fill="none"/>
          <text fill="#c23b2c" font-size="11" font-weight="700" letter-spacing="2">
            <textPath href="#sealArc" startOffset="50%" text-anchor="middle">易宝支付业务专用章</textPath>
          </text>
          <text x="60" y="66" fill="#c23b2c" font-size="15" font-weight="700" text-anchor="middle">交易成功</text>
          <text x="60" y="84" fill="#c23b2c" font-size="9" text-anchor="middle">${v.t.slice(0,10)}</text>
        </svg>`:'<span class="pill bad">受理失败 · 无回单</span>'}
      </div>
    </div>

    <div>
      <div class="sec-title">凭证影像</div>
      <div class="thumbs" style="margin-top:10px">
        ${ok?`
        <div class="thumb"><div class="im">回单 PDF</div><div class="cap">回单_${v.ser}.pdf</div></div>
        <div class="thumb"><div class="im">回单影像 PNG</div><div class="cap">回单_${v.ser}.png</div></div>
        <div class="thumb"><div class="im">通知报文快照</div><div class="cap">notify_${v.req}.json</div></div>`
        :`<div class="thumb"><div class="im">失败响应快照</div><div class="cap">error_${v.req}.json</div></div>`}
      </div>
      <div style="margin-top:10px;display:flex;gap:8px"><button class="btn sm">预览</button><button class="btn sm">下载全部</button></div>
    </div>

    <div>
      <div class="sec-title">请求与返回留痕</div>
      <dl class="kv">
        <dt>请求接口</dt><dd class="mono">${v.api==='订单退款'?'/yop/v2/trade/refund':'/yop/v2/trade/order/transfer'}</dd>
      </dl>
      <pre class="code">请求参数
{
  "requestNo": "${v.req}",

  "payerType": "${v.fromType}",

  "memo": "${v.use}"

{
  "result": "${v.res}",
  "transferStatus": "${v.st}",
  "serialNo": "${v.ser}",
  "receiptUrl": "${ok?'https://receipt.yeepay.com/'+v.ser+'.pdf':''}",
  "notifyCount": ${ok?2:0}
}</pre>
    </div>
  </div></div>`;
}

          <div><div class="l">额度回补</div><div class="v num">¥ ${money(r.amt)}</div></div>
        </div>
      </div>
      <div class="card"><div class="card-b">
        <div class="sec-title">申请信息</div>

          <dt>退款原因</dt><dd>${r.reason}</dd>
          <dt>凭证附件</dt><dd>油机小票_2026082621.jpg · 现场照片_01.jpg</dd>
          <dt>油站审核</dt><dd>${pill(r.s1)}<div class="m2">审核人：沈阳浑南加油站 · 站长 刘伟 · 2026-08-26 21:20</div></dd>
          <dt>运营中台终审</dt><dd>${pill(r.s2==='—'?'待审核':r.s2)}<div class="m2">终审需确认资金轨状态：已调拨成功的订单退款走资金退回 / 冲正</div></dd>
        </dl>
      </div></div>
      <div class="card"><div class="card-b">
        <div class="sec-title">通过后执行动作</div>
        <div class="flow" style="margin-top:10px">
          <span class="n">终审通过</span><span class="ar">→</span>
          <span class="n oil">资金退回：油站公司虚拟账户 → 客户账户</span><span class="ar">→</span>
          <span class="n fee">服务费退回：科技公司虚拟账户 → 油站公司虚拟账户</span><span class="ar">→</span>
          <span class="n">额度回补</span><span class="ar">→</span>
          <span class="n">退款中 → 已退款</span><span class="ar">→</span>
          <span class="n">已开票则触发红冲</span>
        </div>
      </div></div>`;
    },
    apply:()=>{
      const a = APPLIES.find(v=>v.no===key);
      const sp = APPLY_SPLIT[a.no] || [];
      const os = APPLY_ORDERS[a.no] || [];
      document.getElementById('drawerTitle').textContent='开票申请详情';
      return `
      <div class="sumhead"><div class="no mono">${a.no}</div>
        <div class="sec">${a.cust} · 开票方 ${a.station} · ${a.energy} · 申请时间 ${a.t}</div>
        <div class="pills">${pill(a.st)}<span class="tag">${a.ch}</span><span class="tag">${a.mode}</span><span class="tag b">同批 ${a.batch}</span></div>
        <div class="money">
          <div class="oilv"><div class="l">申请金额</div><div class="v num">¥ ${money(a.amt)}</div></div>
          <div><div class="l">已开票金额</div><div class="v num">¥ ${money(a.invoiced)}</div></div>

          <table style="min-width:900px">

            <tbody>${sp.length?sp.map(s=>`<tr><td class="num">${s.seq}</td><td>${s.co}</td><td>${s.energy} · ${s.energy==='天然气'?'9%':'13%'}</td><td><span class="tag">${s.mode}</span></td><td class="num">${money(s.amt)}</td><td class="num">${s.vol}</td><td class="num">${s.orders}</td><td class="mono">${s.inv}</td><td>${pill(s.st)}</td></tr>`).join(''):`<tr><td class="num">1</td><td>${a.station}</td><td>${a.energy} · ${a.energy==='天然气'?'9%':'13%'}</td><td><span class="tag">不拆分</span></td><td class="num">${money(a.amt)}</td><td class="num">${a.vol}</td><td class="num">${a.orders}</td><td class="mono">${a.invoiced?(a.energy==='天然气'?'04412026082700001190':'04412026082600000908'):'—'}</td><td>${pill(a.st)}</td></tr>`}</tbody>
          </table>
        </div>
      </div>
      <div class="card">
        <div class="card-h"><h2>关联订单</h2><span class="spacer"></span><span style="color:var(--muted);font-size:11.5px">共 ${a.orders} 笔，合计 ${money(a.amt)} 元</span></div>
        <div class="tablewrap">
          <table style="min-width:680px">
            <thead><tr><th>订单流水号</th><th>加油时间</th><th>商品</th><th>数量</th><th>金额</th></tr></thead>
            <tbody>${os.length?os.map(o=>`<tr><td class="mono">${o.no}</td><td class="mono">${o.t}</td><td>${o.goods}</td><td class="num">${o.qty}</td><td class="num">${money(o.amt)}</td></tr>`).join(''):'<tr><td colspan="5" class="empty">订单清单加载中</td></tr>'}</tbody>
          </table>
        </div>
      </div>`;

    invoice:()=>{
      const i = INVOICES.find(v=>v.no===key) || INVOICES[0];
      const a = APPLIES.find(v=>v.no===i.apply);
      const os = APPLY_ORDERS[i.apply] || [];
      document.getElementById('drawerTitle').textContent='发票详情';
      return `
      <div class="sumhead"><div class="no mono">${i.no}</div>
        <div class="sec">${i.drawer} → ${i.payee} · ${i.t}</div>
        <div class="pills">${pill(i.st)}${i.kind==='服务费票'?'<span class="tag f">服务费票</span>':'<span class="tag o">油品票</span>'}<span class="tag">${i.src}</span></div>
        <div class="money">
          <div class="oilv"><div class="l">价税合计</div><div class="v num">¥ ${money(i.amt)}</div></div>
          <div><div class="l">不含税金额</div><div class="v num">¥ ${money(i.ex)}</div></div>
          <div class="feev"><div class="l">税额（税率 ${invRate(i)}）</div><div class="v num">¥ ${money(i.tax)}</div></div>
        </div>
      </div>
      <div class="card"><div class="card-b">
        <div class="sec-title">发票要素</div>
        <dl class="kv">
          <dt>开票方</dt><dd>${i.drawer}</dd>
          <dt>受票方</dt><dd>${i.payee}<div class="m2">税号 ${i.taxNo}</div></dd>
          <dt>关联申请单</dt><dd class="mono">${i.apply} · 第 ${i.seq} 张</dd>
          <dt>能源类型</dt><dd>${i.energy} · 税率 ${invRate(i)}</dd>
          <dt>来源</dt><dd>${i.src}</dd>
          <dt>发票文件</dt><dd><a href="#" onclick="return false" style="color:var(--brand-ink)">${i.file}</a></dd>
        </dl>
        <div class="thumbs" style="margin-top:14px">
          <div class="thumb"><div class="im">发票影像</div><div class="cap">${i.file}</div></div>
        </div>
      </div></div>
      ${a?`<div class="card">
        <div class="card-h"><h2>关联订单</h2><span class="spacer"></span><span style="color:var(--muted);font-size:11.5px">经申请单 ${i.apply} 关联</span></div>

          <table style="min-width:680px">
            <thead><tr><th>订单流水号</th><th>加油时间</th><th>商品</th><th>数量</th><th>金额</th></tr></thead>

          </table>
        </div>
      </div>`:''}`;
    },
    feebill:()=>{
      const f = FEEBILLS.find(v=>v.no===key);
      document.getElementById('drawerTitle').textContent='服务费账单明细';
      return `
      <div class="sumhead"><div class="no mono">${f.no}</div>
        <div class="sec">${f.station} · ${f.energy} · 账期 ${f.period} · 生成时间 ${f.t}</div>
        <div class="pills">${pill(f.confirm)}${pill(f.st)}<span class="tag f">服务费票 · 平台 → 油站</span></div>
        <div class="money">
          <div class="feev"><div class="l">服务费合计</div><div class="v num">¥ ${money(f.fee)}</div></div>
          <div><div class="l">订单笔数</div><div class="v num">${f.orders}</div></div>
          <div><div class="l">费率</div><div class="v num">${f.rate}</div></div>
        </div>
      </div>
      <div class="card"><div class="card-b">
        <div class="sec-title">账单信息</div>
        <dl class="kv">
          <dt>油站公司</dt><dd>${f.station}</dd>
          <dt>能源类型</dt><dd>${f.energy}<div class="m2">按能源类型账户分别出账</div></dd>
          <dt>油站确认</dt><dd>${pill(f.confirm)}<div class="m2">超过 3 个工作日未确认默认视为确认</div></dd>
          <dt>发票编号</dt><dd class="mono">${f.inv}</dd>
        </dl>
      </div></div>`;
    }
  };
  document.getElementById('drawerNav').innerHTML = '';
  document.getElementById('drawerBody').classList.add('nonav');
  document.getElementById('drawerMain').innerHTML = map[kind]();
  showDrawer(true);
}

/* ================= 启动 ================= */
go('orders');
</script>
