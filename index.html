<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>油气撮合新增功能原型（订单、发票、账户）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
</head>
<body>
<style>
:root{
  --ground:#eef1f7; --surface:#ffffff; --surface-2:#f7f9fc; --surface-3:#eff3fa;
  --ink:#1b2330; --ink-2:#48536a; --muted:#79839a; --line:#e2e7f1; --line-2:#eceff6;
  --brand:#1e3fa8; --brand-2:#2f54c7; --brand-soft:#e9edfd; --brand-ink:#2544a8;
  --oil:#2f6fed; --oil-soft:#e8f0ff;
  --fee:#a86a08; --fee-soft:#fdf1dd;
  --ok:#0f7f5b; --ok-soft:#e2f5ee;
  --warn:#a96c05; --warn-soft:#fbf0d9;
  --bad:#c23b2c; --bad-soft:#fdeae7;
  --info:#2f6fed; --info-soft:#e9f1ff;
  --note-bg:#f4f6fb; --note-line:#c9d3e6;
  --shadow:0 1px 2px rgba(27,35,48,.05),0 8px 24px -12px rgba(27,35,48,.18);
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#10141c; --surface:#171d27; --surface-2:#1c2430; --surface-3:#212a38;
    --ink:#e8edf6; --ink-2:#b3bdd0; --muted:#8590a6; --line:#2a3444; --line-2:#232c3a;
    --brand:#7f9bff; --brand-2:#93aaff; --brand-soft:#1e2a4a; --brand-ink:#a9bcff;
    --oil:#7aa5ff; --oil-soft:#1c2a45;
    --fee:#e0a94f; --fee-soft:#33280f;
    --ok:#4dc79b; --ok-soft:#122f26;
    --warn:#dfa848; --warn-soft:#32270f;
    --bad:#f0796a; --bad-soft:#38201d;
    --info:#7aa5ff; --info-soft:#1a2740;
    --note-bg:#141a24; --note-line:#334056;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --ground:#10141c; --surface:#171d27; --surface-2:#1c2430; --surface-3:#212a38;
  --ink:#e8edf6; --ink-2:#b3bdd0; --muted:#8590a6; --line:#2a3444; --line-2:#232c3a;
  --brand:#7f9bff; --brand-2:#93aaff; --brand-soft:#1e2a4a; --brand-ink:#a9bcff;
  --oil:#7aa5ff; --oil-soft:#1c2a45;
  --fee:#e0a94f; --fee-soft:#33280f;
  --ok:#4dc79b; --ok-soft:#122f26;
  --warn:#dfa848; --warn-soft:#32270f;
  --bad:#f0796a; --bad-soft:#38201d;
  --info:#7aa5ff; --info-soft:#1a2740;
  --note-bg:#141a24; --note-line:#334056;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
}
:root{color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark}}
:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:Inter,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  font-size:13px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
.mono,.num{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand-2);outline-offset:2px;border-radius:4px}

/* shell */
.app{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:100vh}
.rail{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 16px}
.brand .mark{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--brand),var(--oil));display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px}
.brand b{font-size:15px;letter-spacing:.02em}
.brand small{display:block;color:var(--muted);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase}
.nav{padding:4px 10px 24px;display:flex;flex-direction:column;gap:2px}
.nav .side{display:flex;align-items:center;gap:6px;margin:16px 0 2px;padding:7px 10px;border-radius:7px;
  background:var(--brand-soft);color:var(--brand-ink);font-size:11.5px;font-weight:700;letter-spacing:.06em}
.nav .side:first-child{margin-top:4px}
.nav .side-tag{margin-left:auto;font-weight:500;font-size:10px;opacity:.7;letter-spacing:0}
.nav .grp{padding:9px 8px 4px 14px;color:var(--muted);font-size:10.5px;letter-spacing:.14em}
.nav .subgrp{padding:7px 8px 3px 22px;color:var(--ink-2);font-size:11px;font-weight:600;letter-spacing:.02em}
.nav a{margin-left:8px}
.nav a{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--ink-2);font-size:12.5px}
.nav a:hover{background:var(--surface-3);color:var(--ink)}
.nav a.on{background:var(--brand);color:#fff;font-weight:600;box-shadow:0 6px 14px -8px var(--brand)}
.nav a .dot{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.45;flex:none}
.nav a.on .dot{opacity:1}
.nav a.dis{opacity:.42;cursor:not-allowed}

.main{min-width:0;display:flex;flex-direction:column}
.head{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.head .row1{display:flex;align-items:center;gap:12px;padding:14px 24px 10px}
.head h1{margin:0;font-size:17px;font-weight:600;letter-spacing:.01em}
.head .sub{color:var(--muted);font-size:12px}
.head .spacer{flex:1}
.mode{display:inline-flex;align-items:center;gap:6px;background:var(--fee-soft);color:var(--fee);border:1px solid color-mix(in srgb,var(--fee) 25%,transparent);padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600}
.tabstrip{display:flex;gap:2px;padding:0 24px;overflow-x:auto}
.tabstrip button{background:none;border:0;padding:9px 12px;font-size:12.5px;color:var(--ink-2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabstrip button:hover{color:var(--ink)}
.tabstrip button.on{color:var(--brand-ink);border-bottom-color:var(--brand);font-weight:600}
.body{padding:18px 24px 48px;display:flex;flex-direction:column;gap:14px}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.card-h h2{margin:0;font-size:13.5px;font-weight:600}
.card-h .spacer{flex:1}
.card-b{padding:16px}

/* filters */
.filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 18px;padding:16px 16px 6px}
.filters.collapsed .f:nth-child(n+13){display:none}
.f{display:flex;align-items:center;gap:10px;min-width:0}
.f>label{width:78px;flex:none;text-align:right;color:var(--ink-2);font-size:12px}
.f>label.w2{width:88px}
.ctrl{flex:1;min-width:0;height:30px;border:1px solid var(--line);background:var(--surface-2);border-radius:7px;padding:0 10px;font-size:12px;color:var(--ink);display:flex;align-items:center;gap:6px;cursor:default}
.ctrl.ph{color:var(--muted)}
.ctrl .caret{margin-left:auto;color:var(--muted);font-size:10px}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;height:30px;flex:1}
.seg span{flex:1;display:grid;place-items:center;font-size:12px;color:var(--ink-2);background:var(--surface-2);cursor:pointer;user-select:none}
.seg span.on{background:var(--brand);color:#fff;font-weight:600}

/* 真实表单控件 */
.fc{flex:1;min-width:0;display:flex;align-items:center;gap:6px}
.inp{width:100%;min-width:0;height:30px;border:1px solid var(--line);background:var(--surface-2);border-radius:7px;padding:0 10px;font-size:12px;color:var(--ink);font-family:inherit}
.inp::placeholder{color:var(--muted)}
.inp:hover{border-color:color-mix(in srgb,var(--brand) 40%,var(--line))}
.inp:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 14%,transparent)}
.inp[readonly]{background:var(--surface-3);color:var(--ink-2);cursor:not-allowed}
.inp.calc{background:var(--brand-soft);border-color:color-mix(in srgb,var(--brand) 25%,transparent);font-weight:600;font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.inp.mono,.inp[type="number"]{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.inp[type="number"]{text-align:right}
select.inp{appearance:none;-webkit-appearance:none;cursor:pointer;padding-right:24px;height:30px;line-height:normal;overflow:hidden;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 13px) 13px,calc(100% - 9px) 13px;background-size:4px 4px,4px 4px;background-repeat:no-repeat;color:var(--ink)}
select.inp:invalid,select.inp.is-empty{color:var(--muted)}
textarea.inp{height:64px;padding:7px 10px;resize:vertical;line-height:1.5}
.inp:user-invalid,.inp.bad{border-color:var(--bad);background:var(--bad-soft)}
.num.over{color:var(--bad)}
.dash{color:var(--muted);flex:none;font-size:11px}
.unit{color:var(--muted);flex:none;font-size:11.5px}
.err{color:var(--bad);font-size:11px;display:none}
.err.on{display:block}
.counter{font-size:10.5px;color:var(--muted);text-align:right}
.filter-actions{display:flex;justify-content:flex-end;gap:8px;padding:6px 16px 16px}

.btn{height:30px;padding:0 14px;border-radius:7px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;font-size:12px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--brand);color:var(--brand-ink)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.btn.primary:hover{background:var(--brand-2);color:#fff}
.btn.sm{height:26px;padding:0 10px;font-size:11.5px}

/* quick filter chips */
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line-2)}
.chips button{height:27px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);font-size:12px;cursor:pointer;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.chips button.on{background:var(--brand-soft);border-color:color-mix(in srgb,var(--brand) 40%,transparent);color:var(--brand-ink);font-weight:600}
.chips button b{font-variant-numeric:tabular-nums}
.chips button.alert.on{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 40%,transparent);color:var(--bad)}

/* kpi */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:13px 15px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi .lab{color:var(--muted);font-size:11.5px}
.kpi .val{font-size:21px;font-weight:600;margin-top:4px;letter-spacing:-.01em}
.kpi .sub{font-size:11px;color:var(--muted);margin-top:2px}
.kpi .stripe{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brand)}
.kpi.fee .stripe{background:var(--fee)} .kpi.fee .val{color:var(--fee)}
.kpi.oil .stripe{background:var(--oil)} .kpi.oil .val{color:var(--oil)}
.kpi.warn .stripe{background:var(--warn)} .kpi.warn .val{color:var(--warn)}
.kpi.bad .stripe{background:var(--bad)} .kpi.bad .val{color:var(--bad)}

/* table */
/* 冻结列：仅操作列冻结在右侧，首列不固定 */
th.stickR,td.stickR{position:sticky;right:0;z-index:5;background:var(--surface);border-left:1px solid var(--line)}
thead th.stickR{z-index:7;background:var(--surface-3)}
td.stickR{box-shadow:-6px 0 8px -8px rgba(0,0,0,.28)}
tbody tr:hover td.stickR{background:var(--surface-2)}
/* 列设置面板 */
.colcfg{display:flex;flex-direction:column;gap:6px;max-height:420px;overflow:auto;padding:2px}
.colrow{display:flex;align-items:center;gap:10px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:12px}
.colrow.locked{background:var(--surface-2);color:var(--muted)}
.colrow .nm{flex:1;min-width:0}
.colrow .mv{display:flex;gap:4px}
.colrow .mv button{all:unset;cursor:pointer;width:22px;height:22px;display:grid;place-items:center;border:1px solid var(--line);border-radius:6px;color:var(--ink-2);font-size:11px}
.colrow .mv button:hover{border-color:var(--brand);color:var(--brand-ink)}
.colrow .mv button[disabled]{opacity:.3;cursor:not-allowed}
.lockpill{font-size:10.5px;padding:1px 6px;border-radius:4px;background:var(--brand-soft);color:var(--brand-ink);white-space:nowrap}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
thead th{position:sticky;top:0;background:var(--surface-3);text-align:left;font-size:11.5px;font-weight:600;color:var(--ink-2);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody td{padding:11px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle;font-size:12px}
tbody tr:hover{background:var(--surface-2)}
tbody tr.sub-row{background:var(--surface-2)}
tbody tr.sub-row td{padding-top:8px;padding-bottom:8px;font-size:11.5px;color:var(--ink-2)}
td .t1{font-weight:600;letter-spacing:-.01em}
td .t2{color:var(--muted);font-size:11px;margin-top:2px;overflow-wrap:anywhere}
td .t1.mono,td .t2.mono,td.mono{white-space:nowrap}
.acts{display:flex;flex-wrap:nowrap;gap:6px;justify-content:flex-end;align-items:center;min-height:1.4em;position:sticky;right:0;background:#fff;z-index:2;vertical-align:middle}
.btn-group{display:inline-flex;gap:6px;white-space:nowrap}
.btn-group button{flex:none}
.acts button{background:none;border:0;padding:0;color:var(--brand-ink);cursor:pointer;font-size:12px}
.acts button:hover{text-decoration:underline}
.acts button.danger{color:var(--bad)}
.acts button.off{color:var(--muted);cursor:not-allowed;text-decoration:none}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 24%,transparent)}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 24%,transparent)}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 26%,transparent)}
.pill.info{background:var(--info-soft);color:var(--info);border-color:color-mix(in srgb,var(--info) 24%,transparent)}
.pill.mut{background:var(--surface-3);color:var(--muted);border-color:var(--line)}
.tag{display:inline-flex;align-items:center;padding:1px 6px;border-radius:5px;font-size:10.5px;border:1px solid var(--line);color:var(--ink-2);background:var(--surface-2);white-space:nowrap}
.tag.b{border-color:color-mix(in srgb,var(--brand) 35%,transparent);color:var(--brand-ink);background:var(--brand-soft)}
.tag.f{border-color:color-mix(in srgb,var(--fee) 35%,transparent);color:var(--fee);background:var(--fee-soft)}
.tag.o{border-color:color-mix(in srgb,var(--oil) 35%,transparent);color:var(--oil);background:var(--oil-soft)}
.tag.info{border-color:color-mix(in srgb,var(--info,#3b7ddd) 35%,transparent);color:var(--brand-ink);background:var(--brand-soft)}
.form-tbl{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:10px}
.form-tbl th{width:110px;text-align:left;font-weight:500;color:var(--muted);background:var(--bg2);padding:9px 12px;border:1px solid var(--line-2);white-space:nowrap}
.form-tbl td{padding:9px 12px;border:1px solid var(--line-2);color:var(--ink);overflow-wrap:anywhere}
.form-tbl td .m2{color:var(--muted);font-size:11.5px;margin-top:2px}
.trk{display:flex;flex-direction:column;gap:4px}
.trk .mini{font-size:10.5px;color:var(--muted);display:flex;gap:5px;align-items:center;white-space:nowrap}
.trk .mini i{font-style:normal;width:14px;height:14px;border-radius:4px;display:grid;place-items:center;font-size:9px;font-weight:700;background:var(--surface-3);color:var(--ink-2)}
.trk .mini i.a{background:var(--oil-soft);color:var(--oil)}
.trk .mini i.b{background:var(--fee-soft);color:var(--fee)}

/* pagination */
.pager{display:flex;align-items:center;gap:10px;justify-content:flex-end;padding:12px 16px;color:var(--muted);font-size:12px}
.pager .pg{display:flex;gap:4px}
.pager .pg span{min-width:26px;height:26px;display:grid;place-items:center;border:1px solid var(--line);border-radius:6px;cursor:pointer;color:var(--ink-2);background:var(--surface-2)}
.pager .pg span.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}

/* bottom notes panel — 说明性内容，与原型分离 */
.notes{margin-top:16px;border:1px dashed var(--note-line);border-radius:var(--radius);background:var(--note-bg)}
.notes>summary{cursor:pointer;list-style:none;padding:12px 16px;font-size:12.5px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:8px}
.notes>summary::-webkit-details-marker{display:none}
.notes>summary::before{content:"▸";color:var(--muted);transition:transform .15s}
.notes[open]>summary::before{transform:rotate(90deg)}
.notes>summary .hint{font-weight:400;color:var(--muted);font-size:11.5px;margin-left:auto}
.notes-b{padding:0 16px 16px;display:flex;flex-direction:column;gap:14px;font-size:12px;color:var(--ink-2)}
.notes-b h4{margin:0 0 6px;font-size:12.5px;color:var(--ink);font-weight:600}
.notes-b p{margin:0}
.notes-b ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.notes-b ol{margin:0}
.modetag{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.modetag.m1{background:var(--brand-soft);color:var(--brand-ink);border-color:color-mix(in srgb,var(--brand) 26%,transparent)}
.modetag.m2{background:color-mix(in srgb,var(--ok) 12%,transparent);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 30%,transparent)}
.modetag.m3{background:color-mix(in srgb,var(--fee) 12%,transparent);color:var(--fee);border-color:color-mix(in srgb,var(--fee) 30%,transparent)}
.cprog{display:flex;align-items:center;gap:3px}
.cprog .cs{width:14px;height:4px;border-radius:2px;background:var(--line);flex:none}
.cprog .cs.done{background:var(--brand)}
.cprog .cl{margin-left:6px;font-size:11.5px;color:var(--muted);white-space:nowrap}
.mode.cust{background:var(--brand-soft);color:var(--brand-ink);border-color:color-mix(in srgb,var(--brand) 32%,transparent)}
.notes-b code{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11px;background:var(--surface-3);border:1px solid var(--line);border-radius:4px;padding:1px 4px;color:var(--brand-ink);white-space:nowrap}
.notes-b pre.code{white-space:pre;line-height:1.6}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(15,20,30,.42);opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(1120px,94vw);background:var(--ground);border-left:1px solid var(--line);z-index:61;transform:translateX(100%);transition:transform .26s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;box-shadow:-24px 0 60px -30px rgba(0,0,0,.5)}
.drawer.on{transform:none}
@media (prefers-reduced-motion:reduce){.drawer,.scrim{transition:none}}
.drawer-h{display:flex;align-items:center;gap:10px;min-height:62px;padding:16px 22px;background:var(--surface);border-bottom:1px solid var(--line)}
.drawer-h h2{margin:0;font-size:18px;font-weight:650;display:flex;align-items:center;gap:10px;letter-spacing:.01em}
.drawer-h h2::before{content:"☷";font-size:24px;line-height:1;color:var(--brand);font-weight:700}
.drawer-h .spacer{flex:1}
.x{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;display:grid;place-items:center;color:var(--muted)}

/* 金额大写 */
function rmbUpper(n){
  const d='零壹贰叁肆伍陆柒捌玖', u=['','拾','佰','仟'], g=['','万','亿'];
  let [i,f] = n.toFixed(2).split('.');
  let s='', gi=0;
  while(i.length){
    const part = i.slice(-4); i = i.slice(0,-4);
    let ps='', zero=false;
    for(let k=0;k<part.length;k++){
      const dg=+part[part.length-1-k];
      if(dg===0){ zero=true; } else { if(zero&&ps)ps='零'+ps; zero=false; ps=d[dg]+u[k]+ps; }
    }
    if(ps) s = ps + g[gi] + s;
    gi++;
  }
  s = (s||'零') + '元';
  const jiao=+f[0], fen=+f[1];
  if(!jiao && !fen) return s+'整';
  s += jiao ? d[jiao]+'角' : (fen?'零':'');
  if(fen) s += d[fen]+'分';
  return s;
}

function renderNav(){
  let html = '';
  SIDES.forEach(side=>{
    const pages = PAGES.filter(p=>p.side===side);
    if(!pages.length) return;
    html += `<div class="side">${side}</div>`;
    [...new Set(pages.map(p=>p.grp))].forEach(g=>{
      html += `<div class="grp">${g}</div>`;
      const grpPages = pages.filter(p=>p.grp===g);
      const subgrps = [...new Set(grpPages.map(p=>p.subgrp).filter(Boolean))];
      if(subgrps.length){
        subgrps.forEach(sg=>{
          html += `<div class="subgrp">${sg}</div>` +
            grpPages.filter(p=>p.subgrp===sg).map(p=>
              `<a href="#${p.id}" class="${p.id===current?'on':''}" data-go="${p.id}"><span class="dot"></span>${p.name}</a>`).join('');
        });
        const noSub = grpPages.filter(p=>!p.subgrp);
        if(noSub.length){
          html += noSub.map(p=>
            `<a href="#${p.id}" class="${p.id===current?'on':''}" data-go="${p.id}"><span class="dot"></span>${p.name}</a>`).join('');
        }
      } else {
        html += grpPages.map(p=>
          `<a href="#${p.id}" class="${p.id===current?'on':''}" data-go="${p.id}"><span class="dot"></span>${p.name}</a>`).join('');
      }
    });
  });
  html += `<div class="side">其他模块<span class="side-tag">未实现</span></div>` +
    OTHER.map(o=>`<a class="dis" title="本次不在交付范围"><span class="dot"></span>${o}</a>`).join('');
  document.getElementById('nav').innerHTML = html;
}
function renderTabs(){

/* ================= 控件工厂 =================
   t: text 文本 | code 编号（大写字母数字） | tel 手机号 | plate 车牌
      num 数字 | amt 金额 | sel 下拉 | date 日期 | dt 日期时间
      range 日期区间 | numrange 数字区间 | seg 分段 | ta 多行文本 | file 文件 */
function ctlHTML(o){
  const id = o.id ? ` id="${o.id}"` : '';
  const ro = o.ro ? ' readonly tabindex="-1"' : '';
  const cls = 'inp' + (o.calc?' calc':'') + (o.mono?' mono':'') + (o.req?' req-input':'');
  const ph = o.p ? ` placeholder="${o.p}"` : '';
  const val = o.v!==undefined ? ` value="${o.v}"` : '';
  switch(o.t){
    case 'sel':
      return `<select size="1" class="${cls} is-empty"${id}${o.req?' required':''} data-sel>
        <option value="">${o.p||'请选择'}</option>
        ${(o.o||[]).map(v=>`<option${o.v===v?' selected':''}>${v}</option>`).join('')}</select>`;
    case 'num': case 'amt': {
      const step = o.step!==undefined?o.step:(o.t==='amt'?'0.01':'1');
      const min = o.min!==undefined?o.min:0;
      const max = o.max!==undefined?o.max:(o.t==='amt'?99999999.99:999999);
      return `<input class="${cls}" type="number" inputmode="decimal"${id}${ph}${val}${ro}
        min="${min}" max="${max}" step="${step}"${o.req?' required':''} data-dec="${String(step).split('.')[1]?String(step).split('.')[1].length:0}">`;
    }
    case 'tel':
      return `<input class="${cls} mono" type="tel" inputmode="numeric"${id}${ph}${val}${ro}
        maxlength="11" pattern="1[3-9][0-9]{9}"${o.req?' required':''} data-digits>`;
    case 'plate':
      return `<input class="${cls}" type="text"${id}${ph}${val}${ro} maxlength="8"${o.req?' required':''} data-upper>`;
    case 'code':
      return `<input class="${cls} mono" type="text"${id}${ph}${val}${ro}
        maxlength="${o.max||32}" pattern="[A-Za-z0-9_-]{0,${o.max||32}}"${o.req?' required':''} data-upper data-code>`;
    case 'taxno':

  if(el.hasAttribute('data-code'))   el.value = el.value.replace(/[^A-Za-z0-9_-]/g,'');
  if(el.hasAttribute('data-upper'))  el.value = el.value.toUpperCase();

    const c = el.closest('.fi')?.querySelector('.counter b');

/* 数字：失焦时按 step 规范小数位并夹到 min/max */
document.addEventListener('blur', e=>{
  const el = e.target;
  if(!el.classList || !el.classList.contains('inp') || el.type!=='number' || el.value==='') return;
  const dec = +(el.dataset.dec||0);
  let v = parseFloat(el.value);
  if(isNaN(v)){ el.value=''; return; }
  if(el.min!=='') v = Math.max(+el.min, v);
  if(el.max!=='') v = Math.min(+el.max, v);
  el.value = v.toFixed(dec);
  el.dispatchEvent(new Event('input',{bubbles:true}));
}, true);

const RULE_COMMON = '';

/* ================= 列表通用：列设置 / 冻结列 / 全选 ================= */
const COLDEFS = {};                 /* {listId: [colDef,...]} 注册全部可选列 */
const colState = {};                /* {listId: {order:[k...], hidden:[k...]}} */

function regCols(id, defs){ COLDEFS[id] = defs; return defs; }
function lockedKey(id){ return null; }        /* 首列不固定：所有列均可滚动，仅操作列固定在右侧 */
function lockedLast(id){ const d=COLDEFS[id]||[]; const c=d.find(x=>x.k==='ops'); return c?c.k:null; }  /* 末列固定：操作列，冻结在右 */

function colOrder(id){
  const defs = COLDEFS[id]||[];
  const st = colState[id];
  const known = defs.map(c=>c.k);
  let order = st ? [...st.order.filter(k=>known.includes(k)), ...known.filter(k=>!st.order.includes(k))] : known.slice();
  const last = lockedLast(id);
  order = order.filter(k=>k!==last);                       // 操作列不参与排序，始终在最右
  return last ? [...order, last] : [...order];
}
function visibleCols(id){
  const defs = COLDEFS[id]||[];
  const map = Object.fromEntries(defs.map(c=>[c.k,c]));
  const hidden = (colState[id]||{}).hidden || [];
  return colOrder(id).map(k=>map[k]).filter(c=>c && !hidden.includes(c.k));
}
function rowSelectable(id,o){
  if(id==='orders'||id==='cOrders') return isEnergyInvoiceEligible(o);
  if(id==='fee') return isServiceFeeInvoiceEligible(o);
  return true;
}
/* 统一渲染一张可配置列的表 */
function dataTable(id, list, minWidth, empty){
  const cols = visibleCols(id);
  const head = '<tr><th style="width:38px"><input type="checkbox" data-all="'+id+'" aria-label="全选本页"></th>' +
    cols.map((c,i)=>{
      const k = c.k==='ops' ? 'stickR' : '';
      const cls = k ? ' class="'+k+'"' : '';
      const w = c.w ? ' style="width:'+c.w+'"' : '';
      return `<th${cls}${w}>${c.t}</th>`;
    }).join('') + '</tr>';
  const body = list.length
    ? list.map(o=>{
        const selectable = rowSelectable(id,o);
        return '<tr><td><input type="checkbox" class="row-check" data-no="'+(o.no||o.id||'')+'" aria-label="'+(selectable?'选择本行':'当前记录不可开票')+'" '+(selectable?'':'disabled')+'></td>' +
        cols.map((c,i)=>{
          const cls = [c.k==='ops'?'stickR':'', c.cls||''].filter(Boolean).join(' ');
          return `<td${cls?' class="'+cls+'"':''}>${c.td(o)}</td>`;
        }).join('') + '</tr>';
      }).join('')
    : `<tr><td colspan="${cols.length+1}" class="empty">${empty||'暂无数据'}</td></tr>`;
  return `<div class="tablewrap"><table style="min-width:${minWidth}"><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
}
/* 列设置按钮 */
function colCfgBtn(id){
  const total = (COLDEFS[id]||[]).length, shown = visibleCols(id).length;
  return `<button class="btn sm" data-colcfg="${id}">列设置 <b style="font-weight:600">${shown}/${total}</b></button>`;
}
/* 列设置面板内容 */
let colCfgId = null;
function colCfgBody(){
  const id = colCfgId, defs = COLDEFS[id]||[], lock = lockedKey(id), lockEnd = lockedLast(id);
  const map = Object.fromEntries(defs.map(c=>[c.k,c]));
  const order = colOrder(id), hidden = (colState[id]||{}).hidden||[];
  const movable = order.filter(k=>k!==lock && k!==lockEnd);
  return `
    <div class="banner"><div><b>选择列表要显示哪些字段、以及它们的顺序</b>
      <span class="txt">勾选决定显示与否，上下箭头调整顺序。<b>操作</b> 列固定在最后一列，不能隐藏或移动；横向滚动时冻结在最右侧。设置对导出字段同样生效（操作列不导出）。</span></div></div>
    <div class="colcfg" style="margin-top:12px">
      ${order.map((k,idx)=>{
        const c = map[k]; if(!c) return '';
        if(k===lockEnd) return `<div class="colrow locked">
            <input type="checkbox" checked disabled>
            <span class="nm">${c.t}</span><span class="lockpill">固定末列</span>
            <span class="mv"><button disabled>↑</button><button disabled>↓</button></span></div>`;
        const i = movable.indexOf(k);
        return `<div class="colrow">
            <input type="checkbox" data-colshow="${k}" ${hidden.includes(k)?'':'checked'}>
            <span class="nm">${c.t}</span>
            <span class="mv">
              <button data-colmove="${k}:up" ${i===0?'disabled':''}>↑</button>
              <button data-colmove="${k}:down" ${i===movable.length-1?'disabled':''}>↓</button>
            </span></div>`;
      }).join('')}
    </div>`;
}
function ensureColState(id){
  if(!colState[id]) colState[id] = {order: (COLDEFS[id]||[]).map(c=>c.k), hidden: []};
  return colState[id];
}
document.addEventListener('click', e=>{
  const cfg = e.target.closest('[data-colcfg]');
  if(cfg){ colCfgId = cfg.dataset.colcfg; ensureColState(colCfgId); openModal('colcfg'); return; }
  const mv = e.target.closest('[data-colmove]');
  if(mv){
    const [k,dir] = mv.dataset.colmove.split(':');
    const st = ensureColState(colCfgId);
    st.order = colOrder(colCfgId);
    const i = st.order.indexOf(k), j = dir==='up' ? i-1 : i+1;
    const fixedLast = lockedLast(colCfgId);
    if(j>=0 && j<st.order.length && st.order[j]!==fixedLast){ const t=st.order[i]; st.order[i]=st.order[j]; st.order[j]=t; }
    document.getElementById('modalBody').innerHTML = colCfgBody();
    paint(); return;
  }
  const rst = e.target.closest('[data-colreset]');
  if(rst){ delete colState[colCfgId]; ensureColState(colCfgId);
    document.getElementById('modalBody').innerHTML = colCfgBody(); paint(); return; }
});
document.addEventListener('change', e=>{
  const cs = e.target.closest('[data-colshow]');
  if(cs){
    const st = ensureColState(colCfgId), k = cs.dataset.colshow;
    st.hidden = cs.checked ? st.hidden.filter(x=>x!==k) : [...st.hidden, k];
    paint(); return;
  }
  const all = e.target.closest('[data-all]');
  if(all){
    const tbl = all.closest('table');
    tbl.querySelectorAll('tbody input[type=checkbox]:not(:disabled)').forEach(c=>{ c.checked = all.checked; });
    return;
  }
  const row = e.target.closest('tbody input[type=checkbox]');
  if(row){
    const tbl = row.closest('table'); if(!tbl) return;
    const boxes = [...tbl.querySelectorAll('tbody input[type=checkbox]:not(:disabled)')];
    const head = tbl.querySelector('[data-all]'); if(!head) return;
    head.checked = boxes.length>0 && boxes.every(c=>c.checked);
    head.indeterminate = !head.checked && boxes.some(c=>c.checked);
  }
});

function toggleFeeCheckAll(cb){
  document.querySelectorAll('.fee-check:not(:disabled)').forEach(c=>c.checked=cb.checked);
}
function getCheckedFees(){
  return [...document.querySelectorAll('.row-check:checked')].map(c=>c.dataset.no);
}
function batchDownloadFeeInv(){
  const nos = getCheckedFees();
  if(nos.length===0){ showToast('请先勾选需要下载的发票申请单'); return; }
  const list = FEE_INV_APPLIES.filter(a=>nos.includes(a.no) && a.st==='已开票');
  if(list.length===0){ showToast('勾选的申请单中没有已开票的记录'); return; }
  startAsyncDownload(list.length);
}
function batchDownloadEnergyInv(){
  const nos = getCheckedFees();
  if(nos.length===0){ showToast('请先勾选需要下载的发票申请单'); return; }
  const pool = current==='cApply' ? CAPPLIES : APPLIES;
  const list = pool.filter(a=>nos.includes(a.no) && a.st==='已开票');
  if(list.length===0){ showToast('勾选的申请单中没有已开票的记录'); return; }
  startAsyncDownload(list.length);
}
function batchOrderInvoice(){
  const nos = getCheckedFees();
  if(nos.length===0){ showToast('请先勾选需要开票的订单'); return; }
  const isEnterprise = current==='cOrders';
  const pool = isEnterprise ? CORDERS : ORDERS;
  const eligible = pool.filter(o=>nos.includes(o.no) && isEnergyInvoiceEligible(o));
  if(!eligible.length){ showToast('所选订单不满足开票资格'); return; }

function _getAutoInvCusts(){

function _refreshAutoInvCustCount(){
  var countEl = document.getElementById('autoInvCustCount');

function autoInvRemoveCust(tagEl){

function autoInvAddCust(name){
  if(!name || !name.trim()) return;
  name = name.trim();
  var tags = document.getElementById('autoInvCustTags');
  if(!tags) return;
  var exists = _getAutoInvCusts();
  if(exists.indexOf(name) >= 0){ showToast('该客户已添加'); return; }
  var span = document.createElement('span');
  span.setAttribute('data-cust', name);
  span.style.cssText = 'display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:3px 4px 3px 10px;background-color:#fff;border:1px solid #e2e7f1;border-radius:4px';
  span.innerHTML = name + '<span onclick="autoInvRemoveCust(this.parentElement)" style="display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background-color:#f0f2f6;color:#999;cursor:pointer;font-size:12px;line-height:1">×</span>';
  tags.appendChild(span);
  _refreshAutoInvCustCount();
  var input = document.getElementById('autoInvCustSearch');
  if(input) input.value = '';
}
function autoInvCustSelectAll(){
  for(var i=0;i<_AUTO_INV_CUST_POOL.length;i++){ autoInvAddCust(_AUTO_INV_CUST_POOL[i]); }
}
function autoInvCustClear(){
  var tags = document.getElementById('autoInvCustTags');
  if(tags) tags.innerHTML = '';
  _refreshAutoInvCustCount();
}
function autoInvCustSearchInput(){
  var input = document.getElementById('autoInvCustSearch');
  var dropdown = document.getElementById('autoInvCustDropdown');
  if(!input || !dropdown) return;
  var kw = input.value.trim().toLowerCase();
  var items = dropdown.querySelectorAll('div[data-cust]');
  var selected = _getAutoInvCusts();
  var hasVisible = false;
  for(var i=0;i<items.length;i++){
    var item = items[i];
    var name = item.getAttribute('data-cust');
    var match = !kw || name.toLowerCase().indexOf(kw) >= 0;
    var already = selected.indexOf(name) >= 0;
    item.style.display = (match && !already) ? '' : 'none';
    if(match && !already) hasVisible = true;
  }
  dropdown.style.display = hasVisible ? 'block' : 'none';
}
function autoInvAddFirstMatch(){
  var dropdown = document.getElementById('autoInvCustDropdown');
  var input = document.getElementById('autoInvCustSearch');
  if(!dropdown || !input) return;
  var firstVisible = null;
  var items = dropdown.querySelectorAll('div[data-cust]');
  for(var i=0;i<items.length;i++){
    if(items[i].style.display !== 'none'){ firstVisible = items[i]; break; }
  }
  if(firstVisible){
    autoInvAddCust(firstVisible.getAttribute('data-cust'));
  } else if(input.value.trim()){
    autoInvAddCust(input.value.trim());
  }
  dropdown.style.display = 'none';
}

VIEWS.txns = () => {

    const linked = orderPostedFlows(t.no).filter(f=>f.acctType==='客户' && f.amt<0);
    return linked.length ? linked.map(f=>({t,f,purpose:fundPurpose(f)})) : [{t,f:{id:t.flowNo,amt:-customerDebitAmount(t)},purpose:'油款'}];

/* 弹窗内的联动计算与校验 */
const BINDS = {
  withdraw(){
    const $=id=>document.getElementById(id);
    const bal=$('wd_balance'), amt=$('wd_amt'), chk=$('wd_check');
    if(!amt) return;
    const MAX = parseFloat(bal.value)||0;
    const render=()=>{
      const v = parseFloat(amt.value)||0;
      let msg='';
      if(v<=0)            msg='<span style="color:var(--bad)">请输入提现金额</span>';
      else if(v<100)      msg='<span style="color:var(--bad)">最低提现金额 100 元</span>';
      else if(v>500000)   msg='<span style="color:var(--bad)">单笔提现上限 500,000 元</span>';
      else if(v>MAX)      msg='<span style="color:var(--bad)">提现金额不可超过可提现余额 '+money(MAX)+' 元</span>';
      else                msg='<span style="color:var(--ok)">校验通过：提现 '+money(v)+' 元，预计 2 分钟内到账</span>';
      chk.innerHTML = msg;
      window._wdAmt = v;
    };
    amt.addEventListener('input',render);
    render();
  },
  wdConfig(){
    const box=document.getElementById('wdRuleBox'), day=document.getElementById('wdRuleDay'),
          freq=document.getElementById('wdRuleFreq');
    if(!box) return;
    document.querySelectorAll('input[name="wdType"]').forEach(r=>{
      r.addEventListener('change',()=>{ box.style.display = r.value==='定期提现' && r.checked ? '' : 'none'; });
    });
    if(freq) freq.addEventListener('change',()=>{ day.style.display = freq.value==='每周' ? '' : 'none'; });
  },
  backfill(){
    const $=id=>document.getElementById(id);
    const price=$('bf_price'), qty=$('bf_qty'), amt=$('bf_amt'), fee=$('bf_fee');
    const diff=$('bf_diff'), auto=$('bf_auto');
    if(!price) return;
    let manual = false;                                   // 油款金额是否被手工改过
    const autoAmt = () => (parseFloat(price.value)||0) * (parseFloat(qty.value)||0);
    const syncFee = () => {
      const a = parseFloat(amt.value)||0;
      fee.value = (Math.round(a*FEE_RATE*100)/100).toFixed(2);
    };
    const showDiff = () => {
      const a0 = autoAmt(), a = parseFloat(amt.value)||0;
      const off = manual && Math.abs(a - a0) >= 0.01;
      if(diff) diff.style.display = off ? '' : 'none';
      if(auto) auto.textContent = a0.toFixed(2);
    };
    const recalc = () => {                                // 单价或数量变了：未手工改过就跟着重算
      if(!manual) amt.value = autoAmt().toFixed(2);
      syncFee(); showDiff();
    };
    price.addEventListener('input',recalc);
    qty.addEventListener('input',recalc);
    amt.addEventListener('input',()=>{ manual = true; syncFee(); showDiff(); });
    recalc();
  },
  invoice(){
    const $=id=>document.getElementById(id);
    const mode=$('iv_mode'), tb=$('iv_split'), chk=$('iv_check');
    if(!mode) return;
    const G = INVOICE_PICK.groups;
    const LIMIT = 1000000;
    const manual = {};                       // { g.k: [金额, ...] }
    const splitN = {}; G.forEach(g=>{ splitN[g.k] = g.split; });   // 每家油站公司的发票张数

    const autoAmts = g => {
      let n = parseInt(splitN[g.k])||1;
      n = Math.max(1, Math.min(20, n));
      if(mode.value==='不拆分') n = 1;
      const each = Math.floor(g.amt/n*100)/100;
      const out = []; let acc = 0;
      for(let i=1;i<=n;i++){
        const a = i===n ? +(g.amt-acc).toFixed(2) : each;
        acc = +(acc+a).toFixed(2); out.push(a);
      }
      return out;
    };
    const seedManual = () => { G.forEach(g=>{ manual[g.k] = autoAmts(g); }); };

    const render = () => {
      const isManual = mode.value==='手动拆分';
      const label = isManual ? '手动' : (mode.value==='按体积拆分' ? '按数量' : (mode.value==='不拆分' ? '不拆分' : '按金额'));
      const rows = []; let seq = 0; let allOk = true; const msgs = [];

      G.forEach(g=>{
        const amts = isManual ? (manual[g.k]||[]) : autoAmts(g);

        let sum = 0;
        amts.forEach((a,idx)=>{
          seq++; sum = +(sum + a).toFixed(2);
          const q = g.amt ? +(g.qty*a/g.amt).toFixed(2) : 0;
          const oc = g.amt ? Math.max(1, Math.round(g.orders*a/g.amt)) : 0;
          const over = a > LIMIT;
          rows.push(
            '<tr>' +
            '<td class="num">'+seq+'</td>' +
            '<td><div class="t1">'+g.co+'</div><div class="t2 mono">'+g.taxNo+'</div></td>' +
            '<td>'+g.energy+' · '+g.rate+'</td>' +
            '<td><span class="tag">'+label+'</span></td>' +
            '<td>' + (isManual
                ? '<input class="inp'+(over?' bad':'')+'" type="number" data-manual="'+g.k+'" data-idx="'+idx+'" value="'+a.toFixed(2)+'" min="0.01" max="99999999.99" step="0.01" data-dec="2" style="width:130px">'
                : '<span class="num'+(over?' over':'')+'">'+money(a)+'</span>') + '</td>' +
            '<td class="num">'+q.toFixed(2)+' '+g.unit+'</td>' +
            '<td class="num">'+oc+'</td>' +
            '<td class="acts">' + (isManual
                ? '<button data-del="'+g.k+'" data-idx="'+idx+'" class="'+(amts.length<=1?'off':'danger')+'">删除</button>'
                : '—') + '</td>' +
            '</tr>'
          );
          if(over){ allOk=false; msgs.push(g.co+' 第 '+(idx+1)+' 张超过单张限额'); }
        });

        if(isManual){
          const diff = +(g.amt - sum).toFixed(2);
          const ok = Math.abs(diff) < 0.005;
          if(!ok){ allOk=false; msgs.push(g.co+' 差额 '+(diff>0?'+':'')+money(diff)+' 元'); }
          rows.push(
            '<tr class="sub-row">' +
            '<td></td><td colspan="3">' + g.co + ' 小计</td>' +
            '<td class="num" data-sum="'+g.k+'" style="font-weight:600;color:'+(ok?'var(--ok)':'var(--bad)')+'">'+money(sum)+' / '+money(g.amt)+'</td>' +
            '<td colspan="2" data-state="'+g.k+'">' + (ok ? '<span class="pill ok">已分配完</span>'
                                     : '<span class="pill bad">差额 '+(diff>0?'+':'')+money(diff)+'</span>') + '</td>' +
            '<td class="acts">' + (amts.length<20 ? '<button data-add="'+g.k+'">添加一张</button>' : '<button class="off">已达 20 张</button>') + '</td>' +
            '</tr>'
          );
        }
      });

      tb.innerHTML = rows.join('');

      const total = G.reduce((a,g)=>a+g.amt,0);
      const sumAll = G.reduce((a,g)=>a + (isManual ? (manual[g.k]||[]).reduce((x,y)=>x+y,0) : g.amt), 0);
      chk.innerHTML = allOk
        ? '<span style="color:var(--ok)">校验通过：各张金额之和 '+money(+sumAll.toFixed(2))+' = 合计金额 '+money(total)+'，误差 0；'+G.length+' 家油站公司各至少一张发票 ✓</span>'
        : '<span style="color:var(--bad)">校验不通过：'+[...new Set(msgs)].join('；')+'</span>';
      const btn=$('iv_submit');
      if(btn){ btn.textContent = '生成 '+G.length+' 个开票申请单'; btn.disabled = !allOk; btn.style.opacity = allOk?'':'0.5'; }
    };

    mode.addEventListener('change', ()=>{ if(mode.value==='手动拆分') seedManual(); render(); });
    const nInput = $('iv_count');
    if(nInput) nInput.addEventListener('input', ()=>{
      const v = Math.max(1, Math.min(20, parseInt(nInput.value)||1));
      G.forEach(g=>{ splitN[g.k] = v; });
      if(mode.value!=='手动拆分') render();
    });

    tb.addEventListener('input', e=>{
      const el = e.target.closest('[data-manual]'); if(!el) return;
      const k = el.dataset.manual, idx = +el.dataset.idx;
      manual[k][idx] = parseFloat(el.value)||0;
      // 只更新校验，不整表重绘，避免输入时失焦
      const g = G.find(x=>x.k===k);
      const sum = +manual[k].reduce((a,b)=>a+b,0).toFixed(2);
      const diff = +(g.amt - sum).toFixed(2);
      const ok = Math.abs(diff) < 0.005 && !manual[k].some(a=>a>LIMIT);
      const sumCell = tb.querySelector('[data-sum="'+k+'"]');
      const stCell  = tb.querySelector('[data-state="'+k+'"]');
      if(sumCell){
        sumCell.innerHTML = money(sum)+' / '+money(g.amt);
        sumCell.style.color = ok?'var(--ok)':'var(--bad)';
      }
      if(stCell){
        stCell.innerHTML = ok ? '<span class="pill ok">已分配完</span>'
          : '<span class="pill bad">差额 '+(diff>0?'+':'')+money(diff)+'</span>';
      }
      el.classList.toggle('bad', (parseFloat(el.value)||0) > LIMIT);
      const amtNow = parseFloat(el.value)||0;
      const tr = el.closest('tr');
      if(tr && g.amt){
        tr.children[5].textContent = (g.qty*amtNow/g.amt).toFixed(2) + ' ' + g.unit;
        tr.children[6].textContent = Math.max(1, Math.round(g.orders*amtNow/g.amt));
      }
      let allOk = true; const msgs = [];
      G.forEach(gg=>{
        const sm = +(manual[gg.k]||[]).reduce((a,b)=>a+b,0).toFixed(2);
        const df = +(gg.amt-sm).toFixed(2);
        if(Math.abs(df) >= 0.005){ allOk=false; msgs.push(gg.co+' 差额 '+(df>0?'+':'')+money(df)+' 元'); }
        if((manual[gg.k]||[]).some(a=>a>LIMIT)){ allOk=false; msgs.push(gg.co+' 存在超过单张限额的发票'); }
      });
      const total = G.reduce((a,g2)=>a+g2.amt,0);
      const sumAll = +G.reduce((a,g2)=>a+(manual[g2.k]||[]).reduce((x,y)=>x+y,0),0).toFixed(2);
      chk.innerHTML = allOk
        ? '<span style="color:var(--ok)">校验通过：各张金额之和 '+money(sumAll)+' = 合计金额 '+money(total)+'，误差 0；'+G.length+' 家油站公司各至少一张发票 ✓</span>'
        : '<span style="color:var(--bad)">校验不通过：'+[...new Set(msgs)].join('；')+'</span>';
      const btn=$('iv_submit');
      if(btn){ btn.disabled=!allOk; btn.style.opacity = allOk?'':'0.5'; }
    });

    tb.addEventListener('click', e=>{
      const add = e.target.closest('[data-add]');
      if(add){ const k=add.dataset.add; if(manual[k].length<20){ manual[k].push(0); render(); } return; }
      const del = e.target.closest('[data-del]');
      if(del && !del.classList.contains('off')){
        const k=del.dataset.del, idx=+del.dataset.idx;
        if(manual[k].length>1){ manual[k].splice(idx,1); render(); }
      }
    });

    render();
  }
};

function cfFields(f){
  if(!f || !f.length) return '';
  return `<div class="form">${f.map(x=>ff(x)).join('')}</div>`;
}
function openConfirm(kind, key){
  const c = CONFIRMS[kind]; if(!c) return;
  const m = typeof c==='function' ? c(key) : c;
  document.getElementById('modal').querySelector('.modal-card').classList.add('sm');
  document.getElementById('modalTitle').textContent = m.title;
  document.getElementById('modalBody').innerHTML =
    (m.lead ? `<div class="banner ${m.tone||'warn'}"><div><p class="cf-lead">${m.lead}</p></div></div>` : '') +
    (m.amounts ? `<div class="cf-amt">${m.amounts.map(a=>`<div><div class="l">${a.l}</div><div class="v num ${a.c||''}">${a.c==='oil'||a.c==='fee'?'¥ ':''}${a.v}</div></div>`).join('')}</div>` : '') +
    (m.body ? `<div style="margin:12px 0 4px">${m.body}</div>` : '') +
    (m.kv ? `<div><div class="sec-title">核对信息</div><dl class="cf-kv" style="margin-top:10px">${m.kv.map(r=>`<dt>${r[0]}</dt><dd>${r[1]}</dd>`).join('')}</dl></div>` : '') +
    cfFields(m.fields) +
    (m.list ? `<div><div class="sec-title">确认前请知悉</div><ul class="cf-list" style="margin-top:8px">${m.list.map(x=>`<li>${x}</li>`).join('')}</ul></div>` : '') +
    (m.warn ? `<div class="banner bad"><div><b>不可逆操作</b><span class="txt">${m.warn}</span></div></div>` : '');
  document.getElementById('modalFoot').innerHTML =
    (m.back ? `<button class="btn" data-modal="${m.back}">${m.backTxt||'返回'}</button>` : '')
    + `<button class="btn" data-mclose="1">取消</button><button class="btn ${m.okClass||'primary'}">${m.ok}</button>`;
  modal.classList.add('on');
}

function openModal(kind){
  const m = MODALS[kind];
  document.getElementById('modal').querySelector('.modal-card').classList.remove('sm');
  document.getElementById('modalTitle').textContent = m.title;
  document.getElementById('modalBody').innerHTML = m.body();
  document.getElementById('modalFoot').innerHTML = m.foot;
  modal.classList.add('on');
  if(m.bind && BINDS[m.bind]) BINDS[m.bind]();
}

function drawerIconKey(name=''){
  if(/发票|凭证|回单|文件/.test(name)) return 'file';
  if(/资金|金额|余额|账户|收付|交易/.test(name)) return 'fund';
  if(/进度|记录|日志|时间线/.test(name)) return 'time';
  if(/操作|异常|规则|配置/.test(name)) return 'settings';
  if(/订单|明细|清单|列表/.test(name)) return 'list';
  return 'info';
}
function drawerIcon(name){
  const path = DRAWER_ICON_PATHS[drawerIconKey(name)] || DRAWER_ICON_PATHS.info;
  return `<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">${path}</svg>`;
}
function drawerTabsHTML(tabs,active,attr='dtab',simple=false){
  return tabs.map(t=>`<button type="button" class="${t.id===active?'on':''}" role="tab"
    id="drawer-tab-${t.id}" aria-selected="${t.id===active?'true':'false'}" tabindex="${t.id===active?'0':'-1'}"
    aria-controls="${simple?'drawer-panel-'+t.id:'drawerMain'}" data-${attr}="${t.id}">${drawerIcon(t.name)}<span>${t.name}</span></button>`).join('');
}

let drawerReturnFocus = null;
function showDrawer(on){
  const drawer = document.getElementById('drawer');
  const wasOpen = drawer.classList.contains('on');
  if(on && !wasOpen) drawerReturnFocus = document.activeElement;
  drawer.classList.toggle('on',on);
  drawer.setAttribute('aria-hidden', on?'false':'true');
  document.getElementById('scrim').classList.toggle('on',on);
  document.querySelector('.app').inert = on;
  if(on){
    requestAnimationFrame(()=>document.querySelector('#drawerNav [role="tab"][aria-selected="true"]')?.focus({preventScroll:true}));
  }else if(wasOpen && drawerReturnFocus?.isConnected){
    drawerReturnFocus.focus({preventScroll:true});
  }
}
document.getElementById('drawerClose').onclick = ()=>showDrawer(false);
document.getElementById('scrim').onclick = ()=>showDrawer(false);
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ showDrawer(false); modal.classList.remove('on'); } });

function openOrder(no){
  drawerOrder = ORDERS.find(o=>o.no===no) || ORDERS[0];
  drawerMode = 'ops'; drawerTab = 'info';
  document.getElementById('drawerTitle').textContent = '订单详情';

let drawerMode = 'ops';
const CDRAWER_TABS = [
  {id:'cinfo',  name:'订单信息'},
  {id:'cvoucher', name:'支付凭证'}
];
function openCOrder(no){
  drawerOrder = CORDERS.find(o=>o.no===no) || CORDERS[0];
  drawerMode = 'cust'; drawerTab = 'cinfo';
  document.getElementById('drawerTitle').textContent = '订单详情';
  document.getElementById('drawerBody').classList.remove('nonav');
  paintDrawer();

function paintDrawer(){
  const tabs = drawerMode==='cust' ? CDRAWER_TABS : DRAWER_TABS;
  const map  = drawerMode==='cust' ? CDTAB : DTAB;
  const nav = document.getElementById('drawerNav');
  nav.setAttribute('role','tablist');
  nav.setAttribute('aria-orientation','vertical');
  nav.innerHTML = drawerTabsHTML(tabs,drawerTab);
  const main = document.getElementById('drawerMain');
  main.innerHTML = map[drawerTab](drawerOrder);
  main.setAttribute('role','tabpanel');
  main.setAttribute('aria-labelledby',`drawer-tab-${drawerTab}`);
}
document.getElementById('drawerNav').addEventListener('click',e=>{
  const simple = e.target.closest('[data-stab]');
  if(simple){ activateSimpleDrawerTab(simple.dataset.stab); return; }
  const b = e.target.closest('[data-dtab]'); if(!b) return;
  const tab = b.dataset.dtab;
  if(tab.startsWith('cInv')){
    cInvTab = tab; paintCInvDrawer();
  }else{
    drawerTab = tab; paintDrawer();
  }
});
document.getElementById('drawerNav').addEventListener('keydown',e=>{
  if(!['ArrowDown','ArrowUp','ArrowRight','ArrowLeft','Home','End'].includes(e.key)) return;
  const tabs = [...e.currentTarget.querySelectorAll('[role="tab"]')];
  if(!tabs.length) return;
  const currentIndex = Math.max(0,tabs.indexOf(document.activeElement));
  const forward = e.key==='ArrowDown' || e.key==='ArrowRight';
  let next = e.key==='Home' ? 0 : e.key==='End' ? tabs.length-1 : (currentIndex + (forward?1:-1) + tabs.length) % tabs.length;
  e.preventDefault(); tabs[next].focus(); tabs[next].click();
});

function invOfOrder(o){
  for(const k in APPLY_ORDERS){ if(APPLY_ORDERS[k].some(x=>x.no===o.no)){

}

let simpleDrawerTab = '';
let simpleDrawerTabs = [];
const SIMPLE_DRAWER_NAMES = {
  flowReq:['账户信息'], voucher:['电子回单'], cvoucher:['电子回单','使用说明'],
  fee:['收付与订单','发票信息'], dailyDetail:['逐笔交易'], monthlyDetail:['账单概览','逐笔交易'],
  txnDetail:['交易信息'], refundTxnDetail:['退款信息'], stationAcct:['账户信息','资金流水','可用操作'],
  sfFlow:['交易明细'], refund:['处理进度','申请信息','金额明细','异常处理'],
  feeInvApply:['申请单信息','订单明细','发票文件'], stationFeeInv:['申请单信息','订单明细','发票文件'],
  apply:['申请单信息','订单明细','发票文件'], invoice:['发票要素','关联订单'], feebill:['账单信息']
};
function drawerSectionName(node,kind,index){
  if(node.matches('.receipt')) return '电子回单';
  if(node.matches('details.notes')) return '规则说明';
  let heading = node.querySelector('.sec-title') || node.querySelector('.card-h h2') || node.querySelector('h3');
  if(heading){
    const copy = heading.cloneNode(true);
    copy.querySelectorAll('.title-stat,.spacer,.tag,.pill,.hint').forEach(el=>el.remove());
    const label = copy.textContent.replace(/\s+/g,' ').replace(/[（(]\d+[^）)]*[）)]/g,'').trim();
    if(label) return label.slice(0,16);
  }
  return SIMPLE_DRAWER_NAMES[kind]?.[index] || `详情 ${index+1}`;
}
function activateSimpleDrawerTab(id){
  simpleDrawerTab = id;
  const nav = document.getElementById('drawerNav');
  nav.querySelectorAll('[data-stab]').forEach(button=>{
    const on = button.dataset.stab===id;
    button.classList.toggle('on',on);
    button.setAttribute('aria-selected',on?'true':'false');
    button.tabIndex = on ? 0 : -1;
  });
  document.querySelectorAll('#drawerMain > .drawer-tab-panel').forEach(panel=>{
    panel.hidden = panel.id!==`drawer-panel-${id}`;
  });
  document.getElementById('drawerMain').scrollTop = 0;
}
function renderSimpleDrawerTabs(html,kind){
  const template = document.createElement('template');
  template.innerHTML = html.trim();
  const nodes = [...template.content.children];
  const summaryIndex = nodes.findIndex(node=>node.matches('.sumhead'));
  let summary = summaryIndex>=0 ? nodes.splice(summaryIndex,1)[0] : null;
  if(!nodes.length && summary){ nodes.push(summary); summary = null; }
  nodes.forEach(node=>{ if(node.matches('details.notes')) node.open = true; });
  simpleDrawerTabs = nodes.map((node,index)=>({
    id:`simple-${kind}-${index}`,
    name:drawerSectionName(node,kind,index),
    html:node.outerHTML
  }));
  simpleDrawerTab = simpleDrawerTabs[0]?.id || '';
  drawerMode = 'simple';
  document.getElementById('drawerBody').classList.remove('nonav');
  const nav = document.getElementById('drawerNav');
  nav.setAttribute('role','tablist');
  nav.setAttribute('aria-orientation','vertical');
  nav.innerHTML = drawerTabsHTML(simpleDrawerTabs,simpleDrawerTab,'stab',true);
  const main = document.getElementById('drawerMain');
  main.removeAttribute('role');
  main.removeAttribute('aria-labelledby');
  main.innerHTML = `${summary?summary.outerHTML:''}${simpleDrawerTabs.map(tab=>
    `<section class="drawer-tab-panel" id="drawer-panel-${tab.id}" role="tabpanel" aria-labelledby="drawer-tab-${tab.id}"${tab.id===simpleDrawerTab?'':' hidden'}>${tab.html}</section>`
  ).join('')}`;
}

    const recipient = o.cust || CUST_ME;
    const k = `${o.stationCo}|${recipient}|${o.energy}`;
    if(!groups[k]) groups[k]={drawer:o.stationCo,recipient,energy:o.energy,orders:[],amt:0};
    groups[k].orders.push(o);
    groups[k].amt += (o.real||o.est);
  });
  const rows = Object.values(groups);
  return {rows,html:`<div class="tablewrap"><table style="min-width:760px"><thead><tr><th>开票方</th><th>受票方</th><th>能源类型</th><th>申请金额</th><th>订单数</th><th>拆票规则</th></tr></thead><tbody>${rows.map(g=>`<tr><td>${g.drawer}</td><td>${g.recipient}</td><td>${g.energy}</td><td class="num">${money(g.amt)}</td><td class="num">${g.orders.length}</td><td>仅按系统配置的单张票额阈值</td></tr>`).join('')}</tbody></table></div><p class="note" style="margin-top:8px">本表仅在提交前预览展示；详情页不展示拆票信息，也不按发票行数拆票。</p>`};
}
function energyConfirm(list,title){
  const preview = energyApplicationPreview(list);
  return {title,tone:'warn',lead:`已选择 <b>${list.length}</b> 笔符合资格的订单，将按<b>开票方 + 受票方 + 能源类型</b>生成 <b>${preview.rows.length}</b> 个申请单。`,amounts:[{l:'申请金额合计',v:money(list.reduce((s,o)=>s+(o.real||o.est),0)),c:'oil'},{l:'申请单数',v:String(preview.rows.length),c:''},{l:'提交后状态',v:'待开票',c:''}],body:preview.html,list:['能源发票须满足订单主状态、支付状态要求，并以分账处理完成为前置条件。','申请单号统一按 KP+日期+序号生成。','本期不支持部分开票、自动开票或开票预填单。'],ok:`提交 ${preview.rows.length} 个申请单`,okClass:'primary'};
}
CONFIRMS.orderBatchInvoice = key => {
  const nos=(key||'').split(',');
  return energyConfirm(ORDERS.filter(o=>nos.includes(o.no)&&isEnergyInvoiceEligible(o)),'申请开具能源发票');
};
CONFIRMS.cInvoiceBatch = key => {
  const nos=(key||'').split(',');
  return energyConfirm(CORDERS.filter(o=>nos.includes(o.no)&&isEnergyInvoiceEligible(o)),'提交能源发票申请');
};
CONFIRMS.invoiceSubmit = () => energyConfirm(ORDERS.filter(isEnergyInvoiceEligible),'生成能源发票申请单');
function serviceFeeConfirm(list){
  const groups={};
  list.forEach(f=>{
    const k=f.payerName;
    if(!groups[k]) groups[k]={payer:f.payer,payerName:f.payerName,orders:0,amt:0};
    groups[k].orders+=1; groups[k].amt+=f.amt;
  });
  const rows=Object.values(groups);
  const body=`<div class="tablewrap"><table><thead><tr><th>支付方</th><th>支付方类型</th><th>关联订单数</th><th>申请金额</th></tr></thead><tbody>${rows.map(g=>`<tr><td>${g.payerName}</td><td>${g.payer}</td><td class="num">${g.orders}</td><td class="num">${money(g.amt)}</td></tr>`).join('')}</tbody></table></div>`;
  return {title:'申请开具服务费发票',tone:'warn',lead:`已选择 <b>${list.length}</b> 笔符合资格的服务费订单，仅按<b>支付方</b>拆分为 <b>${rows.length}</b> 个申请单。`,amounts:[{l:'服务费合计',v:money(list.reduce((s,f)=>s+f.amt,0)),c:'fee'},{l:'申请单数',v:String(rows.length),c:''},{l:'提交后状态',v:'待开票',c:''}],body,list:['不按账期或能源类型拆分。','只依据订单主状态和支付状态判定，不依赖账单确认。','本期不提供自动开票。'],ok:`提交 ${rows.length} 个申请单`,okClass:'primary'};
}
CONFIRMS.feeBatchInvoice = key => {
  const nos=(key||'').split(',');
  return serviceFeeConfirm(FEES.filter(f=>nos.includes(f.no)&&isServiceFeeInvoiceEligible(f)));
};
CONFIRMS.feeInvoiceApply = key => serviceFeeConfirm(FEES.filter(f=>(!key||f.no===key)&&isServiceFeeInvoiceEligible(f)));
CONFIRMS.energyInvUpload = key => {
  const a=APPLIES.find(x=>x.no===key)||CAPPLIES.find(x=>x.no===key)||APPLIES[0];
  return {title:'上传能源发票',tone:'ok',lead:`为待开票申请单 <b>${a.no}</b> 上传正式发票文件。`,kv:[['开票方',a.station],['受票方',a.cust||CUST_ME],['申请金额',`${money(a.amt)} 元`],['支持格式','图片、PDF']],fields:[{l:'发票文件',t:'file',p:'选择图片或 PDF 文件，单个不超过 10MB',accept:'image/*,application/pdf',req:1,span:3}],list:['上传弹窗无其他必填字段。','上传完成后申请状态更新为已开票。'],ok:'确认上传',okClass:'primary'};
};
CONFIRMS.energyInvCancel = key => {
  const a=APPLIES.find(x=>x.no===key)||CAPPLIES.find(x=>x.no===key)||APPLIES[0];
  return {title:'撤销发票申请',tone:'bad',lead:`将撤销待开票申请单 <b>${a.no}</b>。`,kv:[['申请状态',pill(a.st)],['申请金额',`${money(a.amt)} 元`]],fields:[{l:'撤销原因',t:'ta',p:'必填，请说明撤销原因',max:200,req:1,span:3}],list:['仅待开票申请单可撤销。','撤销后状态变为已撤销，关联订单可重新申请。','已开票申请单不可撤销；退款不触发发票状态回滚。'],ok:'确认撤销',okClass:'danger'};
};
CONFIRMS.cRefundApply = key => {
  const o=CORDERS.find(x=>x.no===key)||CORDERS[0];
  return {title:'申请退款',tone:'warn',lead:'退款流程与发票流程在本期相互独立。',amounts:[{l:'退款金额',v:money(o.real||o.est),c:'oil'}],kv:[['订单号',`<span class="mono">${o.no}</span>`],['当前发票状态',pill(o.inv)]],fields:[{l:'退款原因',t:'ta',p:'必填，请说明具体情况',max:200,req:1,span:3}],list:['退款成功后按退款流程处理资金与额度。','若订单已经开票，退款不回滚发票状态，也不触发红冲或重新开票。'],ok:'提交退款申请',okClass:'primary'};
};

/* ================= 启动 ================= */
go('orders');
</script>
