'use strict';
const docs=JSON.parse(document.getElementById('documents').textContent),ready={},pending={};let service='oil';
const frame=s=>document.getElementById(s);
function save(s){try{localStorage.setItem('wanyoutong.h5.lastService',s)}catch(e){}}
function enter(s){service=s;for(const key of ['oil','charge'])frame(key).hidden=key!==s;save(s);if(ready[s])frame(s).contentWindow.postMessage({kind:'energy-command',action:'enter'},'*');else pending[s]=true}
window.addEventListener('message',e=>{const d=e.data;if(!d||!['oil','charge'].some(s=>e.source===frame(s).contentWindow))return;if(d.kind==='energy-switch'&&['oil','charge'].includes(d.service))return enter(d.service);if(d.kind==='energy-remember')return save(d.service);if(d.kind==='energy-state'&&['oil','charge'].includes(d.service)){ready[d.service]=true;if(pending[d.service]){delete pending[d.service];frame(d.service).contentWindow.postMessage({kind:'energy-command',action:'enter'},'*')}}});
for(const s of ['oil','charge'])frame(s).srcdoc=new TextDecoder().decode(Uint8Array.from(atob(docs[s]),c=>c.charCodeAt(0)));
let saved;try{saved=localStorage.getItem('wanyoutong.h5.lastService')}catch(e){}const requested=new URLSearchParams(location.search).get('service');if(['oil','charge'].includes(requested))saved=requested;if(['oil','charge'].includes(saved))enter(saved);
</script><script>
/* 深链启动段（原型接入时追加，业务逻辑不改）：?page=<源文件页面 id> 时把指定页顶上去。
   做法是向源文件自己的 iframe 发它本就支持的 energy-command 消息（e.source 必须是该帧的父级，所以只能在这里发）；
   等 charge 帧回报 energy-state 后按需推送，最多 5 次、6 秒后停止，避免与页内操作打架。 */
(function(){
  var q=new URLSearchParams(location.search),want=q.get('page');
  if(!want)return;
  var svc=q.get('service')==='oil'?'oil':'charge',pushes=0,done=false;
  function push(){
    var f=document.getElementById(svc);
    if(done||pushes>=5||!f||!f.contentWindow)return;
    pushes++;
    f.contentWindow.postMessage({kind:'energy-command',action:'page',id:want},'*');
  }
  window.addEventListener('message',function(e){
    var d=e.data;
    if(!d||d.kind!=='energy-state'||d.service!==svc)return;
    if(d.page===want){done=true;return;}
    push();
  });
  setTimeout(push,1200);
  setTimeout(function(){done=true;},6000);
})();
</script></body></html>
